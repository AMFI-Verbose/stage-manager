<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage Manager — Rehearsal &amp; Cue Book</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --bg:#f3f0ea; --paper:#ffffff; --soft:#faf8f4; --soft2:#f5f2ec;
  --line:#e6e1d8; --line2:#d3cdc1;
  --ink:#23252b; --dim:#6e7580; --dim2:#9aa0a9;
  --accent:#a33a31; --accent2:#c2554a; --accent-soft:#f8eae7;
  --blue:#2f6bb0; --blue-soft:#e9f1fa;
  --green:#2f7f5b; --green-soft:#e8f4ee;
  --amber:#a97318; --amber-soft:#fbf2dd;
  --red:#b03a3a; --red-soft:#fbeaea;
  --purple:#6b4fb8;
  --shadow:0 1px 2px rgba(40,32,24,.05), 0 8px 24px -18px rgba(40,32,24,.35);
  --sans:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,"PingFang SC",sans-serif;
  --serif:ui-serif,"Iowan Old Style",Georgia,"Songti SC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(1100px 620px at 6% -14%,rgba(163,58,49,.07),transparent 66%),
  radial-gradient(900px 520px at 102% -6%,rgba(47,107,176,.06),transparent 62%)}
.app{display:flex;height:100vh;position:relative}

/* ---------- rail ---------- */
.rail{width:236px;flex:0 0 236px;border-right:1px solid var(--line);background:#fbf9f5;display:flex;flex-direction:column;padding:22px 16px}
.brand{display:flex;gap:12px;align-items:center;padding:2px 6px 22px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line2);color:var(--accent);font:600 13px/1 var(--mono);display:grid;place-items:center;letter-spacing:.08em;box-shadow:var(--shadow)}
.brand h1{font:600 15px/1.2 var(--sans);letter-spacing:-.01em}
.brand p{font-size:10px;color:var(--dim2);letter-spacing:.09em;text-transform:uppercase;margin-top:4px}
nav#nav{display:flex;flex-direction:column;gap:3px}
.navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:none;color:var(--dim);border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;transition:.15s;position:relative}
.navbtn:hover{background:var(--soft2);color:var(--ink)}
.navbtn.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,32,24,.09)}
.navbtn.on::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--accent)}
.navbtn .n{font:10px/1 var(--mono);color:var(--dim2);width:16px;flex:0 0 16px}
.navbtn.on .n{color:var(--accent)}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:18px}
.rail-foot .label{font-size:9.5px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;margin-bottom:7px}
.rail-foot .rs-title{font-size:12.5px;color:var(--dim);line-height:1.55}
.rail-actions{display:flex;gap:7px;margin-top:14px}
.mini{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--dim);font:11px/1 var(--sans);cursor:pointer;transition:.14s}
.mini:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:76px;flex:0 0 76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);z-index:5}
.tb-eyebrow{font:9.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tb-title{font:600 19px/1.2 var(--serif);letter-spacing:-.01em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tb-right{display:flex;align-items:center;gap:14px}
.save{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim2);white-space:nowrap}
.save .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:34px 40px 70px}
.wrap{max-width:1240px;margin:0 auto;min-width:0}
.scene-detail>*{min-width:0}

/* ---------- atoms ---------- */
.btn{padding:10px 17px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--ink);font:13.5px/1 var(--sans);cursor:pointer;transition:.14s;white-space:nowrap;box-shadow:0 1px 2px rgba(40,32,24,.05)}
.btn:hover{border-color:var(--ink);background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 16px -10px rgba(163,58,49,.9)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.sec{display:block;font:9.5px/1.5 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);margin-bottom:12px}
.h2{font:600 27px/1.15 var(--serif);letter-spacing:-.015em}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.pagehead .desc{font-size:13px;color:var(--dim);margin-top:8px;max-width:56ch}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:10px/1.6 var(--mono);letter-spacing:.04em;border:1px solid;white-space:nowrap}
.b-sfx{color:var(--blue);border-color:#c3d9f0;background:var(--blue-soft)}
.b-lfx{color:var(--amber);border-color:#ecd9ab;background:var(--amber-soft)}
.b-prop{color:var(--green);border-color:#c3e0cf;background:var(--green-soft)}
.b-dim{color:var(--dim);border-color:var(--line2);background:transparent}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.inp,.sel,.ta{text-overflow:ellipsis;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);font:13.5px/1.45 var(--sans);width:100%;transition:.14s}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:80px}
.inp.flat{border-color:transparent;background:transparent;padding:5px 7px}
.inp.flat:hover{border-color:var(--line)}
.inp.flat:focus{border-color:var(--accent);background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft2);border:1px solid var(--line);font-size:11.5px;color:var(--ink)}
.chip .x{cursor:pointer;color:var(--dim2);font-size:12px}
.chip .x:hover{color:var(--red)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
.tbl td{padding:11px 14px;border-bottom:1px solid #efece5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.dim2{color:var(--dim2)}
.empty{padding:40px 14px;text-align:center;color:var(--dim2);font-size:13px}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k{font:9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.kpi .v{font:600 34px/1.1 var(--serif);letter-spacing:-.02em;margin-top:10px}
.kpi .s{font-size:11.5px;color:var(--dim2);margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.cols>*{min-width:0}
.runorder .act{font:9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);padding:18px 20px 8px}
.srow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid #f1eee7;cursor:pointer}
.srow:hover{background:var(--soft2)}
.srow .num{font:11px/1 var(--mono);color:var(--accent);width:36px;flex:0 0 36px;opacity:.9}
.srow .tt{flex:1;min-width:0}
.srow .tt b{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tt span{font-size:11.5px;color:var(--dim2)}
.warn{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #f1eee7;font-size:13px;line-height:1.5}
.warn:last-child{border:0;padding-bottom:0}
.warn .ic{width:16px;flex:0 0 16px;color:var(--amber);font-size:12px}
.warn b{font-weight:600}

/* ---------- scene tabs ---------- */
.scenetabs{display:flex;gap:22px;overflow-x:auto;padding:2px 2px 16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.scenetabs .actcol{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.scenetabs .actlab{font:9px/1 var(--mono);letter-spacing:.14em;color:var(--dim2)}
.stab{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--dim);font:12px/1.2 var(--sans);cursor:pointer;white-space:nowrap;text-align:left;transition:.14s}
.stab:hover{border-color:var(--ink);color:var(--ink)}
.stab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.stab.plus{border-style:dashed;color:var(--dim2)}

/* ---------- stage canvas ---------- */
.stage-frame{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 12px 0;box-shadow:var(--shadow)}
.stage-band{display:flex;align-items:center;justify-content:space-between;gap:12px;font:9px/1 var(--mono);letter-spacing:.24em;color:#b4aea2;padding:9px 2px 7px}
.stage-band>span:first-child{flex:1;text-align:center}
.scenetabs{max-width:100%}
.stage-canvas{position:relative;height:clamp(370px,42vh,500px);overflow:hidden;touch-action:none;
  border-radius:0 0 50% 50% / 0 0 100% 100%;
  background:radial-gradient(ellipse 96% 192% at 50% 0%, #fffefb 0%, #fbf8f1 62%, #f4f0e8 100%);
  box-shadow:0 0 0 1px #d8d1c4, 0 26px 48px -38px rgba(60,44,30,.5), inset 0 3px 0 rgba(255,255,255,.95)}
.stage-canvas::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    repeating-radial-gradient(ellipse 100% 100% at 50% 0%, transparent 0 32.6%, rgba(0,0,0,.035) 32.6% 32.95%, transparent 32.95% 33%),
    repeating-radial-gradient(ellipse 100% 100% at 50% 0%, transparent 0 65.6%, rgba(0,0,0,.035) 65.6% 65.95%, transparent 65.95% 66%),
    linear-gradient(90deg,transparent 49.7%,rgba(0,0,0,.045) 49.85%,rgba(0,0,0,.045) 50.15%,transparent 50.3%)}
.stage-canvas::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 60px -30px rgba(90,70,50,.28)}
.actor-token{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#fff;
  border:2.5px solid var(--c,#888);box-shadow:0 2px 7px rgba(40,32,24,.16);display:grid;place-items:center;
  font:600 13px/1 var(--sans);color:var(--c,#444);cursor:grab;user-select:none;touch-action:none;transition:box-shadow .14s}
.actor-token:hover{box-shadow:0 6px 18px rgba(40,32,24,.24)}
.actor-token.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(40,32,24,.32);z-index:9}
.actor-token .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font:10.5px/1.3 var(--sans);color:#454a52;white-space:nowrap;background:rgba(255,255,255,.9);border-radius:5px;padding:1px 5px;border:1px solid #ece7de;max-width:98px;overflow:hidden;text-overflow:ellipsis}
.prop-token{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border-radius:10px;max-width:118px;
  background:#fff;border:1px solid #d9d2c5;border-left:3px solid #9a8a6e;font:11px/1.3 var(--sans);color:#3c4046;
  cursor:grab;user-select:none;touch-action:none;max-width:170px;box-shadow:0 1px 4px rgba(40,32,24,.12)}
.prop-token:hover{box-shadow:0 5px 14px rgba(40,32,24,.2)}
.prop-token.dragging{cursor:grabbing;box-shadow:0 12px 26px rgba(40,32,24,.28);z-index:9}
.prop-token .sq{width:8px;height:8px;border-radius:2px;background:#b3a487;flex:0 0 8px}
.prop-token span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.actor-token.sel{box-shadow:0 0 0 4px var(--accent-soft),0 0 0 5px rgba(163,58,49,.34),0 7px 20px rgba(40,32,24,.18)}
.prop-token.sel{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px rgba(163,58,49,.3),0 5px 14px rgba(40,32,24,.14)}
.stage-readout{font:10px/1.3 var(--mono);letter-spacing:.08em;color:#7a7266;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:7px;padding:4px 8px;pointer-events:none;opacity:.66;transform:none}
.stage-hint{font-size:11.5px;color:var(--dim2);margin-top:12px;line-height:1.6}
.scene-detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.side{min-width:0;display:flex;flex-direction:column;gap:16px}

.dirbox{width:100%;min-height:92px;resize:vertical;font:12.5px/1.62 var(--sans);border-radius:10px}
.dirbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dirchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.dirchip{padding:4px 10px;border-radius:20px;border:1px solid var(--line2);background:#fff;font:10.5px/1.55 var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap}
.dirchip:hover{border-color:var(--accent);color:var(--accent)}
.dirout{margin-top:11px;display:flex;flex-direction:column;gap:4px}
.dirline{display:flex;gap:6px;font:11px/1.45 var(--sans);color:var(--dim);align-items:baseline}
.dirline .mk{flex:0 0 10px;color:var(--accent)}
.dirline b{color:var(--ink);font-weight:600}
/* side panel rows */
.sp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1eee7}
.sp-row:last-child{border-bottom:0}
.sp-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--c,#888);display:grid;place-items:center;font:600 10px/1 var(--sans);color:var(--c,#444);flex:0 0 30px;background:#fff}
.sp-main{flex:1;min-width:0}
.sp-main b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-main span{font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sp-btn{padding:4px 9px;border-radius:7px;border:1px solid var(--line2);background:#fff;color:var(--dim);font:10.5px/1.4 var(--sans);cursor:pointer;flex:0 0 auto}
.sp-btn:hover{border-color:var(--accent);color:var(--accent)}
.sp-btn.solid{background:var(--soft2);border-color:var(--line2)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.cue-mini{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f1eee7;font-size:12.5px}
.cue-mini:last-child{border:0}
.cue-mini .no{font:10px/1.8 var(--mono);color:var(--dim2);flex:0 0 38px}
.cue-mini .tx{flex:1;line-height:1.5}

/* ---------- live board (backstage) ---------- */
.live{max-width:1160px;margin:0 auto;padding-bottom:112px}
.livehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.livehead .tag{font:10px/1 var(--mono);letter-spacing:.2em;color:var(--dim2);text-transform:uppercase}
.livehead h2{font:600 30px/1.15 var(--serif);letter-spacing:-.01em;margin:7px 0 5px}
.livehead .sub{font-size:12.5px;color:var(--dim)}
.liveclock{text-align:right;min-width:86px}
.liveclock .k{font:9px/1 var(--mono);letter-spacing:.16em;color:var(--dim2);margin-bottom:7px}
.liveclock .v{font:600 24px/1 var(--mono);font-variant-numeric:tabular-nums}
.livegrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1040px){.livegrid{grid-template-columns:minmax(0,1fr)}}
.floorcard{padding:18px 18px 16px}
.floorwrap{position:relative;height:clamp(220px,30vh,320px);border-radius:0 0 50% 50% / 0 0 100% 100%;
  background:radial-gradient(ellipse 96% 192% at 50% 0%,#fffefb,#f6f2ea);box-shadow:inset 0 0 0 1px #e3dcd0}
.floorwrap.small{height:clamp(120px,15vh,150px);margin-top:10px}
.ltok{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--c,#888);
  display:grid;place-items:center;font:600 11px/1 var(--sans);color:var(--c,#444);box-shadow:0 2px 7px rgba(40,32,24,.15)}
.floorwrap.small .ltok{width:30px;height:30px;font-size:8.5px;border-width:1.5px}
.ltok.ok{box-shadow:0 0 0 3px #d7eee0}
.ltok .llbl{position:absolute;top:100%;margin-top:3px;font:9px/1.2 var(--sans);color:#5b616b;background:rgba(255,255,255,.94);padding:0 3px;border-radius:3px;white-space:nowrap;max-width:86px;overflow:hidden;text-overflow:ellipsis}
.ltok.edge-l .llbl{left:-20px;transform:none}
.ltok.edge-r .llbl{left:auto;right:-20px;transform:none}
.floorwrap.small .ltok .llbl{display:none}
.lprop{position:absolute;transform:translate(-50%,-50%);font:9px/1.3 var(--sans);color:#6b6151;background:#fff;border:1px solid #e0d8c8;border-left:2px solid #9a8a6e;
  border-radius:4px;padding:1px 4px;max-width:88px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.floorwrap.small .lprop{font-size:8px;max-width:60px}
.setrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:9px;border:1px solid var(--line2);background:#fff;
  font:11.5px/1.25 var(--sans);color:var(--ink);cursor:pointer;transition:.12s}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn i{width:7px;height:7px;border-radius:2px;background:var(--c,#888);flex:0 0 7px}
.chipbtn.ok{background:#f1f9f4;border-color:#93c3a6;color:#2c6746}
.chipbtn.ok .tick{font-size:10px;color:#2c6746}
.livbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.livbar .btn{flex:1;min-width:118px;justify-content:center}
.livefoot{position:sticky;bottom:0;margin-top:16px;padding:12px 2px 8px;background:linear-gradient(180deg,rgba(243,240,234,0),rgba(243,240,234,.94) 38%)}
.livefoot .gobtn{margin-top:0}
.nextline{display:flex;gap:8px;align-items:baseline;font-size:12px;line-height:1.5;margin-top:8px}
.nextline .k{font:9px/1.6 var(--mono);letter-spacing:.12em;color:var(--dim2);flex:0 0 48px}
.called-mini{max-height:150px;overflow-y:auto}

@media (max-width:720px){
  .app{display:block}
  .rail{width:auto;flex:none;position:sticky;top:0;z-index:22;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px 6px;background:#fbf9f5}
  .brand{padding:0 2px 8px}
  .brand-mark{width:30px;height:30px;border-radius:8px;font-size:11px}
  .brand h1{font-size:13px}
  .brand p{display:none}
  .rail-foot{display:none}
  nav#nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .navbtn{padding:8px 11px;font-size:12px;white-space:nowrap;flex:0 0 auto}
  .navbtn .n{display:none}
  .navbtn.on::before{display:none}
  .topbar{height:auto;flex-basis:auto;padding:10px 14px;gap:10px}
  .tb-eyebrow{display:none}
  .tb-title{font-size:15px}
  .view{padding:18px 14px 90px}
  .livehead h2{font-size:23px}

}
/* ---------- run ---------- */
.runwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.runside{min-width:0;display:flex;flex-direction:column;gap:16px}
.gostage{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:34px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.gostage::before{content:"";position:absolute;inset:0;background:radial-gradient(620px 300px at 50% -30%,rgba(163,58,49,.09),transparent 70%);pointer-events:none}
.now{font:9.5px/1 var(--mono);letter-spacing:.22em;color:var(--dim2)}
.cuebig{font:600 72px/1 var(--mono);letter-spacing:-.03em;margin:16px 0 8px;color:var(--accent);font-variant-numeric:tabular-nums}
.cuedesc{font:400 27px/1.38 var(--serif);letter-spacing:-.01em;max-width:24ch}
.timer{display:flex;gap:30px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.timer div .k{font:9px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.timer div .v{font:500 18px/1.2 var(--mono);margin-top:6px}
.gobtn{margin-top:26px;width:100%;padding:22px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:700 20px/1 var(--sans);letter-spacing:.12em;cursor:pointer;box-shadow:0 14px 30px -16px rgba(163,58,49,.9)}
.gobtn:hover{background:var(--accent2)}
.gobtn:active{transform:translateY(1px)}
.gobtn.next{border-color:var(--line2);background:#fff;color:var(--dim);box-shadow:none;font-size:13.5px;letter-spacing:.05em;padding:15px}
.upnext{border-left:3px solid var(--blue);padding-left:12px;margin-bottom:12px}
.upnext .k{font:9px/1 var(--mono);letter-spacing:.1em;color:var(--blue)}
.upnext .d{font-size:13px;margin-top:5px;line-height:1.5}
.done-list{display:flex;flex-direction:column;max-height:250px;overflow-y:auto}
.done-item{display:flex;gap:10px;padding:7px 0;font-size:11.5px;color:var(--dim2);border-bottom:1px solid #f3f0e9}
.done-item .no{font-family:var(--mono);flex:0 0 42px}
.prog{height:4px;border-radius:4px;background:#eeeae2;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);background:#fff;border:1px solid var(--line2);color:var(--ink);padding:11px 18px;border-radius:11px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:40;box-shadow:0 12px 30px rgba(40,32,24,.18)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- prop rows ---------- */
.proprow{padding:16px 20px;border-bottom:1px solid #f1eee7}
.proprow:last-child{border-bottom:0}
.proprow:hover{background:var(--soft)}
.pr-line{display:flex;gap:10px;align-items:center}
.pr-line + .pr-line{margin-top:9px}
.pr-name{flex:1;font-size:14px;min-width:120px}
.sel.sm,.inp.sm{padding:6px 9px;font-size:11.5px;border-radius:8px}
.pr-cat{width:136px;flex:0 0 136px}
.pr-qty{width:66px;flex:0 0 66px;text-align:center;padding:6px 6px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pr-loc{flex:1.1;min-width:110px}
.pr-notes{flex:1;min-width:110px}
.pr-status{width:128px;flex:0 0 128px}
.pr-add{width:158px;flex:0 0 158px}

/* ---------- cast rows ---------- */
.castrow{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid #f1eee7;flex-wrap:wrap}
.castrow:last-child{border-bottom:0}
.castrow:hover{background:var(--soft)}
.castrow .cr-role{width:140px;flex:0 0 140px;font-size:13.5px}
.castrow .cr-name{width:140px;flex:0 0 140px}
.castrow .cr-notes{flex:1;min-width:100px;font-size:11.5px}
.castrow .cr-scenes{flex:2.2;min-width:170px;font:10.5px/1.7 var(--mono);color:var(--dim);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.castrow .cr-count{font:10.5px/1 var(--mono);color:var(--dim2);flex:0 0 auto;white-space:nowrap}

@media (max-width:1180px){.scene-detail{grid-template-columns:minmax(0,1fr)}.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}}

/* restore appearances for cast who are in a scene but were dragged to the wings */
function ensureApps(){
  sceneList().forEach(sc=>{
    S.cast.forEach(c=>{
      if(!S.apps.some(a=>a.scene===sc.id && a.cast===c.id)) S.apps.push({scene:sc.id, cast:c.id, on:false, zone:null});
    });
  });
}

/* free positions: 0–100 of the stage canvas */
function normalise(){
  if(!Array.isArray(S.pmarks)) S.pmarks = [];
  const dup = {};
  const fresh = {};
  S.apps.forEach(a=>{
    if(a.x==null || a.y==null){
      fresh[a.scene] = true;
      const z = ZONE_XY[a.zone] || [50,54];
      const key = a.scene + '|' + z[0];
      dup[key] = (dup[key]||0) + 1;
      a.x = Math.max(8, Math.min(92, z[0] + (dup[key]-1)*9));
      a.y = Math.max(10, Math.min(90, z[1] + ((dup[key]-1)%2)*13));
    }
  });
  ensurePmarks();
  Object.keys(fresh).forEach(sc=>{ if(onStage(sc).length) layoutScene(sc); });
  /* older saves may sit outside the half-round floor — pull them back inside */
  S.apps.forEach(a=>{ if(a.x != null && a.y != null){ const p = clampDisc(a.x, a.y); a.x = p.x; a.y = p.y; } });
  S.pmarks.forEach(m=>{ const p = clampDisc(m.x, m.y); m.x = p.x; m.y = p.y; });
}

/* the floor is a half-disc: widest at the back wall, tapering to the apron tip */
function discHalf(y){ return 50 * Math.sqrt(Math.max(0, 1 - (y/100)*(y/100))); }
function discSpan(y){ return Math.max(4, discHalf(y) - 9.5); }
function clampDisc(x, y){
  y = Math.max(6, Math.min(88, y));
  const sp = discSpan(y);
  return {x: Math.max(50 - sp, Math.min(50 + sp, x)), y};
}

function layoutScene(scene){
  const list = S.apps.filter(a=>a.scene===scene && a.on && a.x!=null);
  const n = list.length;
  if(!n) return;
  const rows = n <= 4 ? 1 : n <= 8 ? 2 : n <= 12 ? 3 : 4;
  const ys   = rows === 1 ? [52] : rows === 2 ? [40,66] : rows === 3 ? [30,48,66] : [26,40,54,68];
  const per  = Math.ceil(n / rows);
  list.forEach((a,i)=>{
    const r = Math.min(rows - 1, Math.floor(i / per));
    const cnt = Math.min(per, n - r * per);
    const y = ys[r];
    const sp = Math.max(6, Math.min(discHalf(y) - 6.5, discHalf(Math.min(y + 6.5, 100)) - 8.5));
    const x = cnt === 1 ? 50 : 50 - sp + (2 * sp) * (i % per) / (cnt - 1);
    const p = clampDisc(x, y);
    a.x = p.x; a.y = p.y;
  });
}

function layoutProps(scene){
  const marks = pmarksIn(scene);
  const per = 4;
  marks.forEach((m,i)=>{
    const r = Math.floor(i / per);
    const cnt = Math.min(per, marks.length - r*per);
    const y = 7.4 + r * 8;
    const sp = Math.max(4, discHalf(y) - 12);
    const x = cnt === 1 ? 50 : 50 - sp + (2*sp) * (i % per) / (cnt - 1);
    m.x = Math.max(50 - sp, Math.min(50 + sp, x));
    m.y = y;
  });
}

function pmarksIn(scene){
  return (S.pmarks||[]).filter(m=>m.scene===scene && propOf(m.prop));
}

function ensurePmarks(){
  if(!Array.isArray(S.pmarks)) S.pmarks = [];
  let freshProps = false;
  sceneList().forEach(sc=>{
    propsIn(sc.id).forEach(prop=>{
      if(!S.pmarks.some(m=>m.scene===sc.id && m.prop===prop.id)){
        S.pmarks.push({scene:sc.id, prop:prop.id, x:50, y:8});
        freshProps = true;
      }
    });
  });
  S.pmarks = S.pmarks.filter(m=>{
    const prop = propOf(m.prop);
    return prop && prop.scenes.includes(m.scene);
  });
  if(freshProps){
    const touched = new Set(S.pmarks.filter(m=>!m.__spread).map(m=>m.scene));
    touched.forEach(sc=>layoutProps(sc));
    S.pmarks.forEach(m=>{ delete m.__spread; });
  }
}

/* ordering */
const actIndex = id => S.acts.findIndex(a=>a.id===id);
function sceneList(){
  return S.scenes.slice().sort((a,b)=> actIndex(a.act)-actIndex(b.act) || (+a.no)-(+b.no));
}
const sceneIdx = id => sceneList().findIndex(s=>s.id===id);
function cueList(){
  return S.cues.slice().sort((a,b)=>{
    const d = sceneIdx(a.scene)-sceneIdx(b.scene);
    return d !== 0 ? d : S.cues.indexOf(a)-S.cues.indexOf(b);
  });
}
function cueLabel(cue){
  const peers = cueList().filter(c=>c.type===cue.type);
  return TYPES[cue.type].pfx + String(peers.indexOf(cue)+1).padStart(2,'0');
}
const sceneOf = id => S.scenes.find(s=>s.id===id);
const castOf  = id => S.cast.find(c=>c.id===id);
const propOf  = id => S.props.find(p=>p.id===id);
const appOf   = (scene, cast) => S.apps.find(a=>a.scene===scene && a.cast===cast);
const onStage = sid => S.apps.filter(a=>a.scene===sid && a.on && a.x!=null).map(a=>({cast:castOf(a.cast), x:a.x, y:a.y})).filter(x=>x.cast);
const offStage = sid => S.apps.filter(a=>a.scene===sid && !(a.on && a.zone)).map(a=>castOf(a.cast)).filter(Boolean);
const propsIn = sid => S.props.filter(p=>p.scenes.includes(sid));
const cuesIn  = sid => cueList().filter(c=>c.scene===sid);
const sceneTitle = sid => { const s = sceneOf(sid); return s ? (s.title||'Untitled scene') : '—'; };
const sceneTag = sid => {
  const s = sceneOf(sid); if(!s) return '—';
  const a = S.acts.find(x=>x.id===s.act);
  return (a?a.no:'?') + '.' + s.no;
};
function castScenes(castId){
  return sceneList().filter(s=> S.apps.some(a=>a.scene===s.id && a.cast===castId && a.on && a.zone));
}
function initials(name){
  return String(name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function warnings(){
  const out = [];
  sceneList().forEach(s=>{
    const bad = propsIn(s.id).filter(p=>p.status!=='Ready' && p.status!=='In use');
    if(bad.length) out.push({scene:s.id, text:`Scene ${sceneTag(s.id)} calls for ${bad.length} prop${bad.length>1?'s':''} not ready — ${bad.map(p=>p.name).join(', ')}`});
    if(!onStage(s.id).length) out.push({scene:s.id, text:`Scene ${sceneTag(s.id)} has nobody placed on stage yet.`});
  });
  S.props.forEach(p=>{ if(!p.scenes.length) out.push({scene:null, text:`Prop “${p.name}” is not assigned to any scene.`}); });
  S.cast.forEach(c=>{ if(!castScenes(c.id).length) out.push({scene:null, text:`${c.role} (${c.name}) has no entrance — check the scene breakdown.`}); });
  return out;
}

/* ==================================================================
   10. VIEW — RUN SHOW
   ================================================================== */
function fmtClock(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}

function jumpRunScene(dir){
  const list = cueList();
  if(!list.length) return;
  const cur = list[Math.min(UI.runIdx || 0, list.length - 1)];
  const scenes = sceneList();
  let si = sceneIdx(cur.scene) + dir;
  while(si >= 0 && si < scenes.length && !list.some(c=>c.scene===scenes[si].id)) si += dir;
  if(si < 0 || si >= scenes.length){ toast(dir > 0 ? 'Last scene with cues.' : 'First scene with cues.'); return; }
  const fi = list.findIndex(c=>c.scene===scenes[si].id);
  UI.runIdx = Math.max(0, fi);
  UI.executed = UI.executed.slice(0, UI.runIdx);
  render();
}

function liveFloor(sceneId, small){
  const placed = onStage(sceneId);
  const marks  = pmarksIn(sceneId);
  const toks = placed.map(p=>{
    const a = appOf(sceneId, p.cast.id);
    const edge = p.x < 26 ? ' edge-l' : (p.x > 74 ? ' edge-r' : '');
    const short = p.cast.role.split('/')[0].trim();
    return `<span class="ltok${a && a.set ? ' ok' : ''}${edge}" style="left:${p.x}%;top:${p.y}%;--c:${p.cast.color}" title="${esc(p.cast.role)}">${initials(p.cast.name)}<span class="llbl">${esc(short)}</span></span>`;
  }).join('');
  const prs = marks.map(m=>{
    const pr = propOf(m.prop); if(!pr) return '';
    const nm = pr.name.length > 14 ? pr.name.slice(0,13) + '…' : pr.name;
    return `<span class="lprop" style="left:${m.x}%;top:${m.y}%">${esc(nm)}</span>`;
  }).join('');
  return `<div class="floorwrap${small?' small':''}">${toks}${prs}</div>`;
}

function blockingDelta(fromId, toId){
  const a = new Set(onStage(fromId).map(p=>p.cast.id));
  const b = new Set(onStage(toId).map(p=>p.cast.id));
  return {
    enters: [...b].filter(id=>!a.has(id)).map(id=>castOf(id).role),
    exits:  [...a].filter(id=>!b.has(id)).map(id=>castOf(id).role)
  };
}

function viewRun(){
  const list = cueList();
  if(!list.length){
    return `<div class="wrap"><div class="card" style="text-align:center;padding:56px 22px">
      <div class="h2">No cues yet</div>
      <div class="dim" style="font-size:13px;margin:10px 0 20px">The run board follows the cue list. Add SFX, LFX or prop cues first.</div>
      <button class="btn primary" data-view="cues">Go to Sound &amp; Light</button>
    </div></div>`;
  }
  const idx = UI.runIdx || 0;
  if(!UI.started) UI.started = Date.now();

  if(idx >= list.length){
    return `<div class="wrap" style="max-width:760px">
      <div class="gostage" style="text-align:center;padding:60px 30px">
        <div class="now">CURTAIN DOWN</div>
        <div class="cuebig" style="font-size:44px;color:var(--green)">END OF SHOW</div>
        <div class="cuedesc" style="margin:0 auto">All ${list.length} cues called in <span class="mono">${fmtClock(Date.now()-UI.started)}</span>.</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:26px">
          <button class="btn primary" data-act="startrun">Run it again</button>
          <button class="btn ghost" data-view="cuebook">Back to cue sheet</button>
        </div>
      </div>
    </div>`;
  }

  const cue  = list[idx];
  const next = list[idx+1];
  const sc   = sceneOf(cue.scene);
  const act  = S.acts.find(a=>a.id===sc.act);
  const placed = onStage(cue.scene);
  const wings  = offStage(cue.scene);
  const checked = placed.filter(p=>{ const a = appOf(cue.scene, p.cast.id); return a && a.set; }).length;
  const nScene = sceneList()[sceneIdx(cue.scene) + 1];
  const delta = nScene ? blockingDelta(cue.scene, nScene.id) : null;
  const done = UI.executed.slice().reverse().slice(0,5);

  return `<div class="wrap live">
    <div class="livehead">
      <div>
        <div class="tag">Scene ${sceneTag(cue.scene)} · ${esc(act ? act.name : '')}</div>
        <h2>${esc(sc.title)}</h2>
        <div class="sub">${placed.length} on stage · ${wings.length} in the wings · ${cuesIn(cue.scene).length} cue${cuesIn(cue.scene).length===1?'':'s'} in this scene</div>
      </div>
      <div style="display:flex;gap:26px;align-items:flex-end">
        <div class="liveclock"><div class="k">CUE</div><div class="v">${cueLabel(cue)}</div></div>
        <div class="liveclock"><div class="k">${idx+1} / ${list.length}</div><div class="v" id="run-elapsed">${fmtClock(Date.now()-UI.started)}</div></div>
      </div>
    </div>

    <div class="livegrid">
      <div class="card floorcard">
        <div class="sec" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span>Now on stage · ${checked}/${placed.length} checked</span>
          <button class="sp-btn" data-clearset="${cue.scene}" style="flex:0 0 auto">Clear checks</button>
        </div>
        ${liveFloor(cue.scene)}
        <div class="setrow">
          ${placed.map(p=>{
            const a = appOf(cue.scene, p.cast.id);
            return `<button class="chipbtn${a && a.set ? ' ok':''}" style="--c:${p.cast.color}" data-setactor="${p.cast.id}" data-setscene="${cue.scene}"><i></i>${esc(p.cast.role)}${a && a.set ? '<span class="tick">✓</span>' : ''}</button>`;
          }).join('') || '<span class="dim2" style="font-size:11.5px">nobody placed on this floor</span>'}
        </div>
        ${wings.length?`<div class="nextline"><span class="k">WINGS</span><span>${wings.map(c=>esc(c.role)).join(', ')}</span></div>`:''}
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="card">
          <div class="sec">Standby${next?' · '+cueLabel(next):''}</div>
          ${next?`<div class="badge ${TYPES[next.type].cls}" style="margin-bottom:8px">${TYPES[next.type].label.toUpperCase()}</div>
            <div style="font-size:15px;line-height:1.45;margin:6px 0 8px">${esc(next.desc)}</div>
            <div class="dim2" style="font-size:11px">${esc(next.trig)} · ${esc(next.dur||'—')} · scene ${sceneTag(next.scene)}</div>
            <div class="dim2" style="font-size:11px;margin-top:8px">${list.length-idx-1} cue${list.length-idx-1===1?'':'s'} after this one</div>`
            :'<div class="dim" style="font-size:13px">Last cue of the show. Stand by for the call.</div>'}
          ${(()=>{const then=list.slice(idx+2, idx+5); return then.length?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:11px">
            <div style="font:9px/1 var(--mono);letter-spacing:.16em;color:var(--dim2);margin-bottom:7px">THEN</div>
            ${then.map(c=>`<div style="display:flex;gap:8px;align-items:baseline;font-size:11.5px;line-height:1.55">
              <span class="mono" style="flex:0 0 42px;color:var(--dim2);font-size:10px">${cueLabel(c)}</span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.desc)}</span></div>`).join('')}
          </div>`:'';})()}
        </div>

        <div class="card">
          <div class="sec">Now cueing</div>
          <div class="badge ${TYPES[cue.type].cls}">${TYPES[cue.type].label.toUpperCase()}</div>
          <div style="font-size:15px;line-height:1.45;margin:8px 0 6px">${esc(cue.desc)}</div>
          <div class="dim2" style="font-size:11px">${esc(cue.trig)} · ${esc(cue.dur||'—')}</div>
          ${cue.note?`<div class="dim" style="font-size:11.5px;margin-top:8px;line-height:1.5">${esc(cue.note)}</div>`:''}
        </div>

        ${nScene?`<div class="card">
          <div class="sec">Next scene · ${sceneTag(nScene.id)} ${esc(nScene.title)}</div>
          <div class="nextline"><span class="k">ENTERS</span><span>${delta.enters.length?esc(delta.enters.join(', ')):'—'}</span></div>
          <div class="nextline"><span class="k">EXITS</span><span>${delta.exits.length?esc(delta.exits.join(', ')):'—'}</span></div>
          ${liveFloor(nScene.id, true)}
        </div>`:''}

        <div class="card">
          <div class="sec">Called · ${UI.executed.length}</div>
          ${done.length?`<div class="called-mini">${done.map(id=>{
            const c = S.cues.find(x=>x.id===id); if(!c) return '';
            return `<div class="done-item"><span class="no">${cueLabel(c)}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.desc)}</span></div>`;
          }).join('')}</div>`:'<div class="dim2" style="font-size:11.5px">Nothing called yet.</div>'}
        </div>
      </div>
    </div>

    <div class="livefoot">
      <button class="gobtn" data-act="go">GO${next?' <span style="font-size:11px;font-weight:500;letter-spacing:.04em;opacity:.72">→ '+cueLabel(next)+'</span>':''}</button>
      <div class="livbar">
        <button class="btn" data-act="runprev">◀ Previous scene</button>
        <button class="btn" data-act="back">↩ Back one cue</button>
        <button class="btn" data-act="runnext">Next scene ▶</button>
        <button class="btn ghost" data-view="cuebook">Leave the run</button>
      </div>
      <div class="dim2" style="text-align:center;font-size:10px;margin-top:10px;letter-spacing:.08em">SPACE = GO · ESC = LEAVE · TAP A NAME TO CHECK IT OFF</div>
    </div>
  </div>`;
}

/* ==================================================================
   11. ACTIONS
   ================================================================== */
function objFor(kind,id){
  if(kind==='show')  return S.show;
  if(kind==='scene') return S.scenes.find(s=>s.id===id);
  if(kind==='cast')  return S.cast.find(c=>c.id===id);
  if(kind==='prop')  return S.props.find(p=>p.id===id);
  if(kind==='cue')   return S.cues.find(c=>c.id===id);
  return null;
}

function placeActor(id){
  const a = appOf(UI.scene, id);
  if(!a) return;
  const n = onStage(UI.scene).length;
  a.on = true;
  a.x = 26 + (n % 4) * 16;
  a.y = 46 + (Math.floor(n / 4) % 2) * 16;
  save(); render();
  toast('Placed on stage — drag the circle where you want it.');
}

function sendToWings(id){
  const a = appOf(UI.scene, id);
  if(!a) return;
  a.on = false;
  save(); render();
  toast('Moved to the wings.');
}

function autoArrange(){
  layoutScene(UI.scene);
  layoutProps(UI.scene);
  save(); render();
  toast('Stage tidied — grab a circle to fine-tune it.');
}

function addScene(actId){
  if(!S.acts.some(a=>a.id===actId)) actId = S.acts[0] ? S.acts[0].id : null;
  if(!actId){ S.acts.push({id:uid('a'), no:'I', name:'Act I'}); actId = S.acts[0].id; }
  const inAct = sceneList().filter(s=>s.act===actId);
  const no = inAct.length ? Math.max.apply(null, inAct.map(s=>+s.no||0)) + 1 : 1;
  const sc = {id:uid('s'), act:actId, no:String(no), title:'Scene ' + no, duration:'', synopsis:''};
  S.scenes.push(sc); ensureApps(); save();
  UI.scene = sc.id; go('stage');
  toast('Scene ' + no + ' added — rename it below the stage.');
}

function delScene(id){
  const sc = sceneOf(id);
  if(!sc) return;
  if(!confirm('Delete scene ' + sceneTag(id) + (sc.title?' “‘'+sc.title+'”':'') + '? Its cues and placements go with it.')) return;
  S.scenes = S.scenes.filter(s=>s.id!==id);
  S.apps = S.apps.filter(a=>a.scene!==id);
  S.props.forEach(p=>{ p.scenes = p.scenes.filter(x=>x!==id); });
  S.cues = S.cues.filter(c=>c.scene!==id);
  S.pmarks = (S.pmarks||[]).filter(m=>m.scene!==id);
  // renumber the remaining scenes in that act
  sceneList().filter(s=>s.act===sc.act).forEach((s,i)=>{ s.no = String(i+1); });
  UI.scene = sceneList()[0] ? sceneList()[0].id : null;
  save(); render(); toast('Scene deleted.');
}

function addCast(){
  const role = document.getElementById('nc-role').value.trim();
  const name = document.getElementById('nc-name').value.trim();
  if(!role || !name){ toast('Character and actor are both needed.'); return; }
  const palette = ['#f2b45c','#63b2ff','#f78fa7','#6fe0a8','#b58bff','#ffc94d','#ff8f6b','#7fd8c0','#9aa7ff','#d9a3ff'];
  S.cast.push({id:uid('c'), name, role, color:palette[S.cast.length % palette.length],
               notes:document.getElementById('nc-notes').value.trim()});
  ensureApps(); save(); render(); toast(role + ' added to the company.');
}

function addProp(){
  const name = document.getElementById('np-name').value.trim();
  if(!name){ toast('Give the prop a name.'); return; }
  S.props.push({id:uid('p'), name,
    cat:document.getElementById('np-cat').value,
    qty:Number(document.getElementById('np-qty').value)||1,
    status:document.getElementById('np-status').value,
    loc:document.getElementById('np-loc').value.trim(),
    scenes:[], notes:''});
  save(); render(); toast('Prop added to the inventory.');
}

function addCue(){
  const desc = document.getElementById('ncq-desc').value.trim();
  if(!desc){ toast('Describe what happens on the cue.'); return; }
  S.cues.push({id:uid('q'), type:document.getElementById('ncq-type').value,
    scene:document.getElementById('ncq-scene').value, desc,
    trig:document.getElementById('ncq-trig').value,
    dur:document.getElementById('ncq-dur').value.trim(), note:''});
  save(); render(); toast('Cue added.');
}

function startRun(fromIdx){
  UI.runIdx = fromIdx || 0;
  UI.executed = [];
  UI.started = Date.now();
  go('run');
}

function goNext(){
  const list = cueList();
  if((UI.runIdx||0) >= list.length) return;
  UI.executed.push(list[UI.runIdx].id);
  UI.runIdx++;
  render();
}

function goBack(){
  const list = cueList();
  if(!UI.runIdx) return;
  UI.runIdx--;
  UI.executed = UI.executed.slice(0, UI.runIdx);
  render();
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (S.show.title || 'production').replace(/[^\w\-]+/g,'-').toLowerCase() + '-stage-management.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  toast('Backup downloaded.');
}

function filterPropRows(){
  const q = UI.propQ.toLowerCase();
  document.querySelectorAll('[data-prow]').forEach(r=>{
    r.style.display = (!q || r.dataset.name.includes(q)) ? '' : 'none';
  });
}

/* ==================================================================
   12. EVENT WIRING
   ================================================================== */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-view],[data-act],[data-addscene],[data-delscene],[data-place],[data-send],[data-delcast],[data-delprop],[data-delcue],[data-rmprop],[data-rmpropscene],[data-jump]');
  if(!el) return;

  if(el.dataset.view){ go(el.dataset.view, el.dataset.scene); return; }

  if(el.dataset.act){
    const act = el.dataset.act;
    if(act==='export') exportJSON();
    else if(act==='import') document.getElementById('file').click();
    else if(act==='reset'){
      if(confirm('Reset everything to the demo production? Your current changes will be lost.')){
        S = seed(); ensureApps(); save(); UI.runIdx = 0; UI.executed = []; render(); toast('Reset to the demo show.');
      }
    }
    else if(act==='print'){ go('cuebook'); setTimeout(()=>window.print(), 60); }
    else if(act==='newshow'){
      if(confirm('Start a blank production? The current show stays saved until you change it here, and Export makes a backup.')){
        S = blankShow(); ensureApps(); save(); UI.runIdx = 0; UI.executed = []; UI.propQ=''; UI.propStatus='all';
        UI.scene = S.scenes[0].id; go('stage'); toast('Blank show — add your cast, props and cues.');
      }
    }
    else if(act==='addcast') addCast();
    else if(act==='addprop') addProp();
    else if(act==='addcue') addCue();
    else if(act==='startrun') startRun(0);
    else if(act==='autoarrange') autoArrange();
    else if(act==='runmove') runDirections();
    else if(act==='undorun') undoRun();
    else if(act==='runprev') jumpRunScene(-1);
    else if(act==='runnext') jumpRunScene(1);
    else if(act==='go') goNext();
    else if(act==='back') goBack();
    return;
  }

  if(el.dataset.setactor){
    const sceneId = el.dataset.setscene || UI.scene;
    const a = appOf(sceneId, el.dataset.setactor);
    if(a){ a.set = !a.set; save(); render(); }
    return;
  }
  if(el.dataset.clearset){
    const sceneId = el.dataset.clearset;
    S.apps.forEach(a=>{ if(a.scene===sceneId) a.set = false; });
    save(); render();
    return;
  }

  if(el.dataset.dirfill){
    UI.dirText = el.dataset.dirfill;
    const box = document.getElementById('dir-input');
    if(box){ box.value = UI.dirText; box.focus(); box.setSelectionRange(UI.dirText.length, UI.dirText.length); }
    return;
  }

  if(el.dataset.place){ placeActor(el.dataset.place); return; }
  if(el.dataset.send){ sendToWings(el.dataset.send); return; }

  if(el.dataset.delcast){
    const c = S.cast.find(x=>x.id===el.dataset.delcast);
    if(c && confirm('Remove ' + c.role + ' (' + c.name + ') from the company?')){
      S.cast = S.cast.filter(x=>x.id!==c.id); S.apps = S.apps.filter(a=>a.cast!==c.id);
      save(); render();
    }
    return;
  }
  if(el.dataset.addscene){ addScene(el.dataset.addscene); return; }
  if(el.dataset.delscene){ delScene(el.dataset.delscene); return; }

  if(el.dataset.delprop){
    const p = propOf(el.dataset.delprop);
    if(p && confirm('Delete prop “' + p.name + '”?')){ S.props = S.props.filter(x=>x.id!==p.id); save(); render(); }
    return;
  }
  if(el.dataset.delcue){
    const c = S.cues.find(x=>x.id===el.dataset.delcue);
    if(c && confirm('Delete cue ' + cueLabel(c) + '?')){ S.cues = S.cues.filter(x=>x.id!==c.id); save(); render(); }
    return;
  }
  if(el.dataset.rmprop){
    const p = propOf(el.dataset.rmprop);
    if(p){ p.scenes = p.scenes.filter(s=>s!==UI.scene); ensurePmarks(); save(); render(); }
    return;
  }
  if(el.dataset.rmpropscene){
    const [pid, sid] = el.dataset.rmpropscene.split('|');
    const p = propOf(pid);
    if(p){ p.scenes = p.scenes.filter(s=>s!==sid); ensurePmarks(); save(); render(); }
    return;
  }
  if(el.dataset.jump){
    startRun(Number(el.dataset.jump));
    return;
  }
});

document.addEventListener('input', e=>{
  const el = e.target;

  if(el.id==='prop-q'){ UI.propQ = el.value; filterPropRows(); return; }

  const k = el.dataset.k, f = el.dataset.f;
  if(!k || !f) return;
  const o = objFor(k, el.dataset.i);
  if(!o) return;
  o[f] = el.type==='number' ? Number(el.value) : el.value;
  if(k==='show' && f==='title'){
    document.getElementById('show-title').textContent = el.value || 'Untitled production';
  }
  if(k==='scene' && f==='title'){
    document.querySelectorAll('[data-view="stage"][data-scene]').forEach(b=>{
      if(b.dataset.scene===el.dataset.i){ b.textContent = '' + sceneOf(el.dataset.i).no + '. ' + el.value; }
    });
  }
  save();
});

document.addEventListener('change', e=>{
  const el = e.target;

  if(el.id==='file'){
    const file = el.files && el.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data.scenes || !data.cast || !data.props || !data.cues) throw new Error('shape');
        S = data; ensureApps(); save(); UI.runIdx = 0; UI.executed = []; render();
        toast('Production imported.');
      }catch(err){ toast('That file is not a stage management backup.'); }
    };
    reader.readAsText(file);
    el.value = '';
    return;
  }

  if(el.id==='prop-status'){ UI.propStatus = el.value; render(); return; }

  if(el.dataset.copyfrom){
    const dst = el.dataset.copyfrom;
    const src = el.value;
    if(!src) return;
    if(src === '__clear'){
      S.apps.filter(a=>a.scene===dst).forEach(a=>{ a.on = false; });
    } else {
      const from = S.apps.filter(a=>a.scene===src && a.on && a.x!=null);
      S.apps.filter(a=>a.scene===dst).forEach(a=>{
        const match = from.find(x=>x.cast===a.cast);
        if(match){ a.on = true; a.x = match.x; a.y = match.y; } else { a.on = false; }
      });
    }
    save(); render();
    toast(src === '__clear' ? 'Stage cleared.' : 'Blocking copied — adjust from here.');
    return;
  }

  if(el.dataset.addpropscene){
    const p = propOf(el.dataset.addpropscene);
    const sid = el.value;
    if(p && sid){ p.scenes.push(sid); ensurePmarks(); save(); render(); }
    return;
  }
  if(el.dataset.addprop){
    const p = propOf(el.value);
    if(p){ p.scenes.push(el.dataset.addprop); ensurePmarks(); save(); render(); }
    return;
  }

  const k = el.dataset.k, f = el.dataset.f;
  if(!k || !f) return;
  const o = objFor(k, el.dataset.i);
  if(!o) return;
  o[f] = el.type==='number' ? Number(el.value) : el.value;
  save();
  if(el.tagName==='SELECT') render();
});

document.addEventListener('keydown', e=>{

/* ---------- move tokens around the floor ---------- */
let tokDrag = null;
let selected = null;
const moveStack = [];

function zoneLabel(x, y){
  const row = y < 33 ? 'US' : y < 67 ? 'CS' : 'DS';
  const col = x < 33 ? 'R'  : x < 67 ? 'C'  : 'L';
  return row + '-' + col;
}

function updateReadout(x, y){
  const el = document.getElementById('stage-readout');
  if(!el) return;
  if(x == null){ el.textContent = 'free floor'; el.style.opacity = '.6'; return; }
  el.textContent = zoneLabel(x, y) + ' · ' + Math.round(x) + ' / ' + Math.round(y);
  el.style.opacity = '1';
}

function applySelection(){
  document.querySelectorAll('.actor-token,.prop-token').forEach(el=>{
    const on = !!selected && el.dataset.kind === selected.kind && el.dataset.id === selected.id;
    el.classList.toggle('sel', on);
  });
}

function syncToken(kind, id, x, y){
  const el = document.querySelector('[data-kind="' + kind + '"][data-id="' + id + '"]');
  if(el){ el.style.left = x + '%'; el.style.top = y + '%'; }
}

function pushMove(kind, id, prev){
  moveStack.push({kind, id, scene:UI.scene, prev, batch:dirBatch});
  if(moveStack.length > 40) moveStack.shift();
}

function undoMove(){
  if(!moveStack.length){ toast('Nothing to undo.'); return; }
  const m = moveStack.pop();
  if(m.kind === 'cast'){
    const a = appOf(m.scene, m.id);
    if(a){ a.x = m.prev.x; a.y = m.prev.y; }
  } else {
    const mk = pmarksIn(m.scene).find(k=>k.prop === m.id);
    if(mk){ mk.x = m.prev.x; mk.y = m.prev.y; }
  }
  save();
  if(UI.view === 'stage' && m.scene === UI.scene){
    syncToken(m.kind, m.id, m.prev.x, m.prev.y);
    updateReadout(m.prev.x, m.prev.y);
  }
  toast('Move undone.');
}

function nudge(dx, dy){
  if(!selected) return;
  if(selected.kind === 'cast'){
    const a = appOf(UI.scene, selected.id);
    if(!a) return;
    pushMove('cast', selected.id, {x:a.x, y:a.y});
    const p1 = clampDisc(a.x + dx, a.y + dy);
    a.x = p1.x; a.y = p1.y;
    syncToken('cast', selected.id, a.x, a.y);
    updateReadout(a.x, a.y);
  } else {
    const m = pmarksIn(UI.scene).find(k=>k.prop === selected.id);
    if(!m) return;
    pushMove('prop', selected.id, {x:m.x, y:m.y});
    const p2 = clampDisc(m.x + dx, m.y + dy);
    m.x = p2.x; m.y = p2.y;
    syncToken('prop', selected.id, m.x, m.y);
    updateReadout(m.x, m.y);
  }
  save();
}

document.addEventListener('pointerdown', e=>{
  const canvas = document.getElementById('stage-canvas');
  if(!canvas) return;
  const el = e.target.closest('.actor-token,.prop-token');
  if(!el || !canvas.contains(el)){
    if(selected){ selected = null; applySelection(); }
    return;
  }
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const box = el.getBoundingClientRect();
  tokDrag = {
    el, kind: el.dataset.kind, id: el.dataset.id, r, moved: false,
    sx: e.clientX, sy: e.clientY, x: null, y: null,
    offX: e.clientX - (box.left + box.width / 2),
    offY: e.clientY - (box.top + box.height / 2)
  };
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.classList.add('dragging');
});

document.addEventListener('pointermove', e=>{
  if(!tokDrag) return;
  const r = tokDrag.r;
  const raw = clampDisc(((e.clientX - tokDrag.offX - r.left) / r.width) * 100,
                        ((e.clientY - tokDrag.offY - r.top) / r.height) * 100);
  const x = raw.x, y = raw.y;
  if(Math.abs(e.clientX - tokDrag.sx) > 3 || Math.abs(e.clientY - tokDrag.sy) > 3) tokDrag.moved = true;
  tokDrag.x = x; tokDrag.y = y;
  tokDrag.el.style.left = x + '%';
  tokDrag.el.style.top  = y + '%';
  updateReadout(x, y);
});

function endTokenDrag(){
  if(!tokDrag) return;
  const d = tokDrag;
  tokDrag = null;
  d.el.classList.remove('dragging');

  selected = {kind:d.kind, id:d.id};
  applySelection();

  if(!d.moved){
    if(d.kind === 'cast'){
      const a = appOf(UI.scene, d.id);
      if(a) updateReadout(a.x, a.y);
    } else {
      const m = pmarksIn(UI.scene).find(k=>k.prop === d.id);
      if(m) updateReadout(m.x, m.y);
    }
    return;
  }
  if(d.x == null) return;

  if(d.kind === 'cast'){
    const a = appOf(UI.scene, d.id);
    if(a){
      pushMove('cast', d.id, {x:a.x, y:a.y});
      a.x = d.x; a.y = d.y; a.on = true;
    }
  } else {
    const m = pmarksIn(UI.scene).find(k=>k.prop === d.id);
    if(m){ pushMove('prop', d.id, {x:m.x, y:m.y}); m.x = d.x; m.y = d.y; }
  }
  save();
}
document.addEventListener('pointerup', endTokenDrag);
document.addEventListener('pointercancel', endTokenDrag);

/* ---------- direction engine: type a note, the floor moves ---------- */
const ROW_WORDS = [['upstage', 26], ['downstage', 63], ['centre', 50], ['center', 50],
                   ['middle', 50], ['mid', 50], ['front', 63], ['back', 26]];
let dirRunning = false, dirBatch = 0;

function tokenEl(kind, id){
  return document.querySelector('[data-kind="' + kind + '"][data-id="' + id + '"]');
}

function dirCastIndex(){
  const idx = [];
  S.cast.forEach(c=>{
    idx.push([c.name.toLowerCase(), c]);
    c.role.toLowerCase().split(/[\/,&]+|\band\b/).forEach(pt=>{
      let t = pt.trim();
      if(t.length > 1){
        idx.push([t, c]);
        if(t.indexOf('the ') === 0) idx.push([t.slice(4).trim(), c]);
      }
    });
  });
  return idx.sort((a,b)=>b[0].length - a[0].length);
}

function dirMatch(text){
  const found = [];
  let rest = ' ' + text.toLowerCase().replace(/[’']s\b/g, '') + ' ';
  dirCastIndex().forEach(([key,c])=>{
    if(found.indexOf(c.id) >= 0) return;
    const esc = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(^|[^a-z])' + esc + '([^a-z]|$)');
    if(re.test(rest)){ found.push(c.id); rest = rest.replace(re, '$1 '); }
  });
  return found;
}

function dirIntent(text){
  const t = ' ' + text.toLowerCase() + ' ';
  const exit  = /\b(exit|exits|exiting|leave|leaves|clears?|clear the|out)\b/.test(t);
  const enter = /\b(enter|enters|entrance|come on|comes on|come in|comes in)\b/.test(t);
  let row = null;
  ROW_WORDS.forEach(([w,y])=>{ if(row == null && new RegExp('\\b' + w + '\\b').test(t)) row = y; });
  let col = 0;
  if(/\b(stage left|house left|left)\b/.test(t)) col = -1;
  else if(/\b(stage right|house right|right)\b/.test(t)) col = 1;
  return {exit, enter, row, col, any: row != null || col !== 0};
}

function compileDirections(raw){
  const lines = raw.split(/[\n\r;]+/).map(x=>x.trim().replace(/^[-•*\u2022]\s*/,'').replace(/^\d+[\.\)]\s*/,'')).filter(Boolean);
  return lines.map(line=>{
    const lower = line.toLowerCase();
    const whole = /\b(everyone|everybody|all|company|whole cast|the cast)\b/.test(lower);
    if(whole){
      const it = dirIntent(line);
      const ids = onStage(UI.scene).map(p=>p.cast.id);
      if(it.exit) return {line, ids, mode:'exit', ok:true};
      if(/\b(marks|mark|places|reset|arrange|tidy|line up)\b/.test(lower)) return {line, ids, mode:'layout', ok:true};
      return {line, ids, mode:'move', row: it.row != null ? it.row : 46, col: it.col, ok:true};
    }
    const ids = dirMatch(line);
    if(!ids.length) return {line, ids:[], mode:'—', ok:false, note:'no character I recognise'};
    const it = dirIntent(line);
    if(it.exit)  return {line, ids, mode:'exit', ok:true};
    if(!it.any && !it.enter) return {line, ids, mode:'—', ok:false, note:'name a place — “to downstage left”'};
    return {line, ids, mode: it.enter ? 'enter' : 'move', row:it.row, col:it.col, ok:true};
  });
}

function stepTarget(a, st){
  const y = st.row != null ? st.row : (st.mode === 'enter' ? 46 : a.y);
  const sp = discSpan(y);
  const x = st.col ? 50 + st.col * 0.84 * sp : (st.row != null && a.on ? a.x : 50);
  return clampDisc(x, y);
}

function animateToken(kind, id, x, y, ms, op){
  const el = tokenEl(kind, id);
  if(!el) return;
  el.style.transition = 'left ' + ms + 'ms cubic-bezier(.33,.02,.24,1), top ' + ms + 'ms cubic-bezier(.33,.02,.24,1)'
                      + (op != null ? ', opacity .45s linear' : '');
  el.style.left = x + '%';
  el.style.top  = y + '%';
  if(op != null) el.style.opacity = String(op);
}

function spawnToken(a){
  const canvas = document.getElementById('stage-canvas');
  const c = S.cast.find(x=>x.id === a.cast);
  if(!canvas || !c) return null;
  const tmp = document.createElement('div');
  tmp.innerHTML = tokCast({cast:c, x:a.x, y:a.y});
  const el = tmp.firstElementChild;
  if(!el) return null;
  el.style.opacity = '0';
  canvas.appendChild(el);
  return el;
}

function execStep(st, done){
  const scene = UI.scene, ms = 820;
  if(st.mode === 'layout'){
    layoutScene(scene);
    onStage(scene).forEach(p=>{ const a = appOf(scene, p.cast.id); if(a) animateToken('cast', a.cast, a.x, a.y, ms); });
    setTimeout(()=>{ save(); done(); }, ms + 80);
    return;
  }
  const ids = st.ids.filter(id=>appOf(scene, id));
  ids.forEach((id, n)=>{
    setTimeout(()=>{
      const a = appOf(scene, id);
      if(!a) return;
      if(st.mode === 'exit'){
        pushMove('cast', id, {x:a.x, y:a.y, on:true});
        animateToken('cast', id, a.x < 50 ? -14 : 114, a.y + 5, ms, 0);
        a.on = false;
        return;
      }
      const t = stepTarget(a, st);
      if(!a.on){
        a.on = true;
        a.x = t.x < 50 ? -12 : 112;
        a.y = t.y;
        spawnToken(a);
        requestAnimationFrame(()=>animateToken('cast', id, t.x, t.y, ms, 1));
      } else {
        pushMove('cast', id, {x:a.x, y:a.y, on:a.on});
        a.x = t.x; a.y = t.y; a.on = true;
        animateToken('cast', id, t.x, t.y, ms);
      }
    }, n * 95);
  });
  setTimeout(()=>{ save(); done(); }, ids.length * 95 + ms + 100);
}

function dirLine(st){
  const mark = st.ok ? '→' : '·';
  return '<div class="dirline"><span class="mk" style="' + (st.ok ? '' : 'opacity:.45') + '">' + mark + '</span>' +
         '<span><b>' + esc(st.line) + '</b>' + (st.note ? ' <span style="color:var(--dim2)">— ' + esc(st.note) + '</span>' : '') + '</span></div>';
}

function runDirections(){
  if(dirRunning){ toast('Still moving — give it a second.'); return; }
  const box = document.getElementById('dir-input');
  if(!box || !box.value.trim()){
    toast('Write a direction first, e.g. “Puck crosses to downstage left”.');
    if(box) box.focus();
    return;
  }
  const steps = compileDirections(box.value);
  const out = document.getElementById('dir-out');
  if(!steps.length) return;
  const runnable = steps.filter(s=>s.ok);
  if(!runnable.length){
    if(out) out.innerHTML = steps.map(dirLine).join('');
    return;
  }
  dirRunning = true;
  dirBatch += 1;
  const btn = document.querySelector('[data-act="runmove"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Moving…'; }
  if(out) out.innerHTML = '';
  let i = 0, moved = 0;
  const tick = ()=>{
    if(i >= steps.length){
      dirRunning = false;
      if(btn){ btn.disabled = false; btn.textContent = 'Run moves'; }
      save(); render();
      const o = document.getElementById('dir-out');
      if(o) o.innerHTML = steps.map(dirLine).join('');
      toast(moved ? 'Blocking updated — ' + moved + ' move' + (moved === 1 ? '' : 's') + '.' : 'Nothing to move.');
      return;
    }
    const st = steps[i++];
    if(!st.ok){ setTimeout(tick, 70); return; }
    if(out) out.insertAdjacentHTML('beforeend', dirLine(st));
    execStep(st, ()=>{ moved += st.ids.length; setTimeout(tick, 130); });
  };
  tick();
}

function undoRun(){
  if(!moveStack.length){ toast('Nothing to undo.'); return; }
  const b = moveStack[moveStack.length-1].batch || 0;
  let n = 0;
  while(moveStack.length && (moveStack[moveStack.length-1].batch || 0) === b){
    const m = moveStack.pop(); n++;
    if(m.kind === 'cast'){
      const a = appOf(m.scene, m.id);
      if(a){ a.x = m.prev.x; a.y = m.prev.y; if('on' in m.prev) a.on = m.prev.on; }
    } else {
      const mk = pmarksIn(m.scene).find(k=>k.prop === m.id);
      if(mk){ mk.x = m.prev.x; mk.y = m.prev.y; }
    }
  }
  save(); render();
  toast(n + ' move' + (n === 1 ? '' : 's') + ' undone.');
}

/* keyboard: nudge, undo, deselect */
document.addEventListener('keydown', e=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;

  if((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')){
    if(UI.view === 'stage' && moveStack.length){ e.preventDefault(); undoMove(); }
    return;
  }
  if(e.key === 'Escape' && UI.view === 'stage'){ selected = null; applySelection(); return; }
  if(UI.view !== 'stage' || !selected) return;

  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(selected.kind === 'cast'){ e.preventDefault(); sendToWings(selected.id); }
    return;
  }
  const step = e.shiftKey ? 5 : 1;
  let dx = 0, dy = 0;
  if(e.key === 'ArrowLeft') dx = -step;
  else if(e.key === 'ArrowRight') dx = step;
  else if(e.key === 'ArrowUp') dy = -step;
  else if(e.key === 'ArrowDown') dy = step;
  if(!dx && !dy) return;
  e.preventDefault();
  nudge(dx, dy);
});

document.addEventListener('keydown', e=>{
  if(UI.view!=='run') return;
  if(e.code==='Space' && !(document.activeElement && document.activeElement.tagName==='BUTTON')){ e.preventDefault(); goNext(); }
  if(e.key==='Escape'){ go('cuebook'); }
});

setInterval(()=>{
  const el = document.getElementById('run-elapsed');
  if(el && UI.view==='run' && UI.started) el.textContent = fmtClock(Date.now()-UI.started);
}, 1000);

render();
</script>
