function objFor(kind,id){
  if(kind==='show')  return S.show;
  if(kind==='scene') return S.scenes.find(s=>s.id===id);
  if(kind==='cast')  return S.cast.find(c=>c.id===id);
  if(kind==='prop')  return S.props.find(p=>p.id===id);
  if(kind==='cue')   return S.cues.find(c=>c.id===id);
  return null;
}

function placeActor(id){
  const a = appOf(UI.scene, id);
  if(!a) return;
  const n = onStage(UI.scene).length;
  a.on = true;
  a.x = 26 + (n % 4) * 16;
  a.y = 46 + (Math.floor(n / 4) % 2) * 16;
  save(); render();
  toast(T('Placed on stage — drag the circle where you want it.'));
}

function sendToWings(id){
  const a = appOf(UI.scene, id);
  if(!a) return;
  a.on = false;
  save(); render();
  toast(T('Moved to the wings.'));
}

function autoArrange(){
  layoutScene(UI.scene);
  layoutProps(UI.scene);
  save(); render();
  toast(T('Stage tidied — grab a circle to fine-tune it.'));
}

/* ---------- path recording ---------- */
function startPath(edit){
  if(!selected || selected.kind !== 'cast'){ toast(T('Select an actor first.')); return; }
  const a = appOf(UI.scene, selected.id);
  if(!a || !a.on){ toast(T('Place the actor on stage first.')); return; }
  pathMode = {scene:UI.scene, cast:selected.id,
              points: edit && Array.isArray(a.path) ? a.path.map(p=>({x:p.x, y:p.y})) : []};
  render();
  toast(T(edit ? 'Editing path — click the floor to add points.' : 'Recording path — click the floor to add points.'));
}

function addPathPoint(clientX, clientY, canvas){
  if(!pathMode) return;
  if(pathMode.points.length >= 30){ toast(T('A path can have up to 30 points.')); return; }
  const r = canvas.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const screen = {x:((clientX - r.left) / r.width) * 100, y:((clientY - r.top) / r.height) * 100};
  const logical = tfBack(screen.x, screen.y);
  const p = clampDisc(logical.x, logical.y);
  pathMode.points.push({x:Math.round(p.x*100)/100, y:Math.round(p.y*100)/100});
  render();
}

function undoPathPoint(){
  if(!pathMode) return;
  pathMode.points.pop();
  render();
}

function savePath(){
  if(!pathMode) return;
  const a = appOf(pathMode.scene, pathMode.cast);
  const pts = cleanPath(pathMode.points);
  if(a){
    if(pts.length) a.path = pts; else delete a.path;
  }
  pathMode = null;
  resetRunMotion();
  save(); render();
  toast(pts.length ? T('Path saved — {n}.', {n:pl(pts.length,'point')}) : T('Path cleared.'));
}

function cancelPath(){
  pathMode = null;
  render();
  toast(T('Path changes discarded.'));
}

function clearPath(){
  if(!selected || selected.kind !== 'cast') return;
  const a = appOf(UI.scene, selected.id);
  if(!a) return;
  delete a.path;
  resetRunMotion();
  save(); render();
  toast(T('Path cleared.'));
}

function previewPath(){
  if(!selected || selected.kind !== 'cast') return;
  const id = selected.id;
  const a = appOf(UI.scene, id);
  if(!a || !Array.isArray(a.path) || !a.path.length) return;
  const pts = a.path.map(p=>({x:p.x, y:p.y}));
  const scene = UI.scene;
  let i = 0;
  const step = ()=>{
    if(i >= pts.length) return;
    const p = pts[i++];
    animateToken('cast', id, p.x, p.y, 700);
    setTimeout(step, 760);
  };
  step();
  toast(T('Previewing the path.'));
  setTimeout(()=>{ if(UI.view === 'stage' && UI.scene === scene) render(); }, pts.length * 770 + 800);
}

function romanNum(n){
  const map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
               [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out = '';
  map.forEach(([v,s])=>{ while(n >= v){ out += s; n -= v; } });
  return out;
}

function addAct(){
  const no = romanNum(S.acts.length + 1);
  const raw = prompt(T('Name this act'), T('Act {no}', {no}));
  if(raw === null) return;
  const name = String(raw).trim() || T('Act {no}', {no});
  const act = {id:uid('a'), no, name};
  S.acts.push(act);
  addScene(act.id);
  toast(T('Act {no} added.', {no}));
}

function renameAct(id){
  const act = S.acts.find(a=>a.id===id);
  if(!act) return;
  const raw = prompt(T('Rename act {no}', {no:act.no}), act.name || T('Act {no}', {no:act.no}));
  if(raw === null) return;
  const name = String(raw).trim();
  if(!name){ toast(T('Act name unchanged.')); return; }
  act.name = name;
  save(); render();
  toast(T('Act {no} renamed to “{name}”.', {no:act.no, name}));
}

function addScene(actId){
  if(!S.acts.some(a=>a.id===actId)) actId = S.acts[0] ? S.acts[0].id : null;
  if(!actId){ S.acts.push({id:uid('a'), no:'I', name:'Act I'}); actId = S.acts[0].id; }
  const inAct = sceneList().filter(s=>s.act===actId);
  const no = inAct.length ? Math.max.apply(null, inAct.map(s=>+s.no||0)) + 1 : 1;
  const sc = {id:uid('s'), act:actId, no:String(no), title:'Scene ' + no, duration:'', synopsis:''};
  S.scenes.push(sc); ensureApps(); save();
  UI.scene = sc.id; go('stage');
  toast(T('Scene {no} added — rename it below the stage.', {no}));
}

function resetShow(){
  S = seed(); ensureApps(); normalise(); save();
  moveStack.length = 0; selected = null; pathMode = null; resetRunMotion();
  UI.runIdx = 0; UI.executed = []; UI.started = null; UI.dirText = '';
  UI.propQ = ''; UI.propStatus = 'all';
  UI.scene = S.scenes[0] ? S.scenes[0].id : null;
  saveUI(); render();
  toast(T('Reset to the demo show.'));
}

function newShow(){
  S = blankShow(); ensureApps(); normalise(); save();
  moveStack.length = 0; selected = null; pathMode = null; resetRunMotion();
  UI.runIdx = 0; UI.executed = []; UI.started = null; UI.dirText = '';
  UI.propQ = ''; UI.propStatus = 'all';
  UI.scene = S.scenes[0] ? S.scenes[0].id : null;
  saveUI(); go('stage');
  toast(T('Blank show — add your cast, props and cues.'));
}

function delScene(id){
  const sc = sceneOf(id);
  if(!sc) return;
  if(!confirm(T('Delete scene {scene}? Its cues and placements go with it.', {scene:sceneTag(id) + (sc.title?' “'+sc.title+'”':'')}))) return;
  const before = JSON.stringify(S), label = T('scene {tag}', {tag:sceneTag(id)});
  S.scenes = S.scenes.filter(s=>s.id!==id);
  S.apps = S.apps.filter(a=>a.scene!==id);
  S.props.forEach(p=>{ p.scenes = p.scenes.filter(x=>x!==id); });
  S.cues = S.cues.filter(c=>c.scene!==id);
  S.pmarks = (S.pmarks||[]).filter(m=>m.scene!==id);
  // renumber the remaining scenes in that act
  sceneList().filter(s=>s.act===sc.act).forEach((s,i)=>{ s.no = String(i+1); });
  UI.scene = sceneList()[0] ? sceneList()[0].id : null;
  rememberDelete(label, before, id); persist();
  render(); toast(T('Scene deleted — ⌘/Ctrl Z to undo.'));
}

function addCast(){
  const role = document.getElementById('nc-role').value.trim();
  const name = document.getElementById('nc-name').value.trim();
  if(!role || !name){ toast(T('Character and actor are both needed.')); return; }
  const palette = ['#f2b45c','#63b2ff','#f78fa7','#6fe0a8','#b58bff','#ffc94d','#ff8f6b','#7fd8c0','#9aa7ff','#d9a3ff'];
  S.cast.push({id:uid('c'), name, role, color:palette[S.cast.length % palette.length],
               notes:document.getElementById('nc-notes').value.trim()});
  ensureApps(); save(); render(); toast(T('{role} added to the company.', {role}));
}

function addProp(){
  const name = document.getElementById('np-name').value.trim();
  if(!name){ toast(T('Give the prop a name.')); return; }
  S.props.push({id:uid('p'), name,
    cat:document.getElementById('np-cat').value,
    qty:Number(document.getElementById('np-qty').value)||1,
    status:document.getElementById('np-status').value,
    loc:document.getElementById('np-loc').value.trim(),
    scenes:[], notes:''});
  save(); render(); toast(T('Prop added to the inventory.'));
}

function addCue(){
  const desc = document.getElementById('ncq-desc').value.trim();
  if(!desc){ toast(T('Describe what happens on the cue.')); return; }
  S.cues.push({id:uid('q'), type:document.getElementById('ncq-type').value,
    scene:document.getElementById('ncq-scene').value, desc,
    trig:document.getElementById('ncq-trig').value,
    dur:document.getElementById('ncq-dur').value.trim(), note:''});
  save(); render(); toast(T('Cue added.'));
}

function startRun(fromIdx){
  resetRunMotion();
  UI.runIdx = fromIdx || 0;
  UI.executed = [];
  UI.started = Date.now();
  go('run');
}

function goNext(){
  const list = cueList();
  if((UI.runIdx||0) >= list.length) return;
  const fromScene = list[UI.runIdx].scene;
  UI.executed.push(list[UI.runIdx].id);
  UI.runIdx++;
  saveUI();
  queueMove(fromScene, list[UI.runIdx] ? list[UI.runIdx].scene : null);
  render();
}

function goBack(){
  const list = cueList();
  if(!UI.runIdx) return;
  const fromScene = list[UI.runIdx].scene;
  UI.runIdx--;
  UI.executed = UI.executed.slice(0, UI.runIdx);
  saveUI();
  queueMove(fromScene, list[UI.runIdx] ? list[UI.runIdx].scene : null);
  render();
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (S.show.title || 'production').replace(/[^\w\-]+/g,'-').toLowerCase() + '-stage-management.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  toast(T('Backup downloaded.'));
}

function filterPropRows(){
  const q = UI.propQ.toLowerCase();
  document.querySelectorAll('[data-prow]').forEach(r=>{
    r.style.display = (!q || r.dataset.name.includes(q)) ? '' : 'none';
  });
}

/* ==================================================================
   12. EVENT WIRING
   ================================================================== */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-view],[data-act],[data-lang],[data-face],[data-mirror],[data-auto],[data-setactor],[data-clearset],[data-addact],[data-addscene],[data-delscene],[data-renameact],[data-place],[data-send],[data-delcast],[data-delprop],[data-delcue],[data-rmprop],[data-rmpropscene],[data-jump],[data-path-start],[data-path-edit],[data-path-save],[data-path-cancel],[data-path-undo],[data-path-clear],[data-path-preview]');
  if(!el) return;

  if(el.dataset.lang){ setLanguage(el.dataset.lang); return; }
  if(el.dataset.view){ go(el.dataset.view, el.dataset.scene); return; }

  if(el.dataset.act){
    const act = el.dataset.act;
    if(act==='export') exportJSON();
    else if(act==='import') document.getElementById('file').click();
    else if(act==='reset'){
      if(confirm(T('Reset everything to the demo production? Your current changes will be lost.'))) resetShow();
    }
    else if(act==='print'){ go('cuebook'); setTimeout(()=>window.print(), 60); }
    else if(act==='newshow'){
      if(confirm(T('Start a blank production? The current show stays saved until you change it here, and Export makes a backup.'))) newShow();
    }
    else if(act==='addcast') addCast();
    else if(act==='addprop') addProp();
    else if(act==='addcue') addCue();
    else if(act==='startrun') startRun(0);
    else if(act==='autoarrange') autoArrange();
    else if(act==='lineup') lineUp();
    else if(act==='runmove') runDirections();
    else if(act==='undorun') undoRun();
    else if(act==='runprev') jumpRunScene(-1);
    else if(act==='runnext') jumpRunScene(1);
    else if(act==='go') goNext();
    else if(act==='back') goBack();
    else if(act==='replaypaths') replayRunPaths();
    return;
  }

  if(el.dataset.face){
    UI.face = el.dataset.face === 'u' ? 'u' : 'd';
    persistUI(); render();
    return;
  }
  if(el.dataset.mirror){
    UI.mirror = !UI.mirror;
    persistUI(); render();
    return;
  }
  if(el.dataset.auto){
    UI.auto = !UI.auto;
    persistUI(); render();
    toast(T(UI.auto ? 'Auto-move on — the cast walks to their marks.' : 'Auto-move off.'));
    return;
  }
  if(el.dataset.setactor){
    const sceneId = el.dataset.setscene || UI.scene;
    const a = appOf(sceneId, el.dataset.setactor);
    if(a){ a.set = !a.set; save(); render(); }
    return;
  }
  if(el.dataset.clearset){
    const sceneId = el.dataset.clearset;
    S.apps.forEach(a=>{ if(a.scene===sceneId) a.set = false; });
    save(); render();
    return;
  }

  if(el.dataset.dirfill){
    UI.dirText = el.dataset.dirfill;
    const box = document.getElementById('dir-input');
    if(box){ box.value = UI.dirText; box.focus(); box.setSelectionRange(UI.dirText.length, UI.dirText.length); }
    return;
  }

  if(el.dataset.place){ placeActor(el.dataset.place); return; }
  if(el.dataset.send){ sendToWings(el.dataset.send); return; }

  if(el.dataset.delcast){
    const c = S.cast.find(x=>x.id===el.dataset.delcast);
    if(c && confirm(T('Remove {role} ({name}) from the company?', {role:c.role, name:c.name}))){
      const before = JSON.stringify(S);
      S.cast = S.cast.filter(x=>x.id!==c.id); S.apps = S.apps.filter(a=>a.cast!==c.id);
      rememberDelete(T('cast member {role}', {role:c.role}), before, null); persist();
      render(); toast(T('{role} removed — ⌘/Ctrl Z to undo.', {role:c.role}));
    }
    return;
  }
  if(el.dataset.addact){ addAct(); return; }
  if(el.dataset.addscene){ addScene(el.dataset.addscene); return; }
  if(el.dataset.delscene){ delScene(el.dataset.delscene); return; }
  if(el.dataset.renameact){ renameAct(el.dataset.renameact); return; }

  if(el.dataset.delprop){
    const p = propOf(el.dataset.delprop);
    if(p && confirm(T('Delete prop “{name}”?', {name:p.name}))){
      const before = JSON.stringify(S);
      S.props = S.props.filter(x=>x.id!==p.id);
      ensurePmarks();
      rememberDelete(T('prop “{name}”', {name:p.name}), before, null); persist();
      render(); toast(T('Prop deleted — ⌘/Ctrl Z to undo.'));
    }
    return;
  }
  if(el.dataset.delcue){
    const c = S.cues.find(x=>x.id===el.dataset.delcue);
    if(c && confirm(T('Delete cue {label}?', {label:cueLabel(c)}))){
      const before = JSON.stringify(S), label = T('cue {label}', {label:cueLabel(c)});
      S.cues = S.cues.filter(x=>x.id!==c.id);
      rememberDelete(label, before, null); persist();
      render(); toast(T('Cue deleted — ⌘/Ctrl Z to undo.'));
    }
    return;
  }
  if(el.dataset.rmprop){
    const p = propOf(el.dataset.rmprop);
    if(p){ p.scenes = p.scenes.filter(s=>s!==UI.scene); ensurePmarks(); save(); render(); }
    return;
  }
  if(el.dataset.rmpropscene){
    const [pid, sid] = el.dataset.rmpropscene.split('|');
    const p = propOf(pid);
    if(p){ p.scenes = p.scenes.filter(s=>s!==sid); ensurePmarks(); save(); render(); }
    return;
  }
  if(el.dataset.jump){
    startRun(Number(el.dataset.jump));
    return;
  }
  if(el.dataset.pathStart !== undefined){ startPath(false); return; }
  if(el.dataset.pathEdit !== undefined){ startPath(true); return; }
  if(el.dataset.pathSave !== undefined){ savePath(); return; }
  if(el.dataset.pathCancel !== undefined){ cancelPath(); return; }
  if(el.dataset.pathUndo !== undefined){ undoPathPoint(); return; }
  if(el.dataset.pathClear !== undefined){ clearPath(); return; }
  if(el.dataset.pathPreview !== undefined){ previewPath(); return; }
});

document.addEventListener('input', e=>{
  const el = e.target;

  if(el.id==='prop-q'){ UI.propQ = el.value; filterPropRows(); return; }

  const k = el.dataset.k, f = el.dataset.f;
  if(!k || !f) return;
  const o = objFor(k, el.dataset.i);
  if(!o) return;
  o[f] = el.type==='number' ? Number(el.value) : el.value;
  if(k==='show' && f==='title'){
    document.getElementById('show-title').textContent = el.value || T('Untitled production');
  }
  if(k==='scene' && f==='title'){
    document.querySelectorAll('[data-view="stage"][data-scene]').forEach(b=>{
      if(b.dataset.scene===el.dataset.i){ b.textContent = '' + sceneOf(el.dataset.i).no + '. ' + el.value; }
    });
  }
  save();
});

document.addEventListener('change', e=>{
  const el = e.target;

  if(el.dataset.speed){
    UI.speed = Number(el.value) || 0;
    persistUI(); render();
    return;
  }

  if(el.id==='file'){
    const file = el.files && el.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const clean = normaliseShow(JSON.parse(reader.result));
        if(!clean) throw new Error('shape');
        if(!confirm(T('Replace “{old}” with “{new}”? The current show will be overwritten.', {old:S.show.title, new:clean.show.title || T('Untitled production')}))) return;
        const prev = S, prevUI = JSON.stringify(UI);
        try{
          S = clean;
          ensureApps();
          normalise();
          moveStack.length = 0; selected = null; pathMode = null; resetRunMotion();
          UI.runIdx = 0; UI.executed = []; UI.started = null; UI.dirText = '';
          UI.propQ = ''; UI.propStatus = 'all';
          if(!sceneOf(UI.scene)) UI.scene = sceneList()[0] ? sceneList()[0].id : null;
          render();
          save();
          saveUI();
          toast(T('Production imported.'));
        }catch(err){
          S = prev;
          try{ UI = Object.assign(UI, JSON.parse(prevUI)); }catch(e){}
          try{ render(); }catch(e){}
          toast(T('That file is not a stage management backup.'));
        }
      }catch(err){ toast(T('That file is not a stage management backup.')); }
    };
    reader.readAsText(file);
    el.value = '';
    return;
  }

  if(el.id==='prop-status'){ UI.propStatus = el.value; render(); return; }

  if(el.dataset.copyfrom){
    const dst = el.dataset.copyfrom;
    const src = el.value;
    if(!src) return;
    if(src === '__clear'){
      S.apps.filter(a=>a.scene===dst).forEach(a=>{ a.on = false; });
    } else {
      const from = S.apps.filter(a=>a.scene===src && a.on && a.x!=null);
      S.apps.filter(a=>a.scene===dst).forEach(a=>{
        const match = from.find(x=>x.cast===a.cast);
        if(match){
          a.on = true; a.x = match.x; a.y = match.y;
          if(Array.isArray(match.path) && match.path.length) a.path = match.path.map(p=>({x:p.x, y:p.y}));
          else delete a.path;
        } else {
          a.on = false; delete a.path;
        }
      });
    }
    save(); render();
    toast(T(src === '__clear' ? 'Stage cleared.' : 'Blocking copied — adjust from here.'));
    return;
  }

  if(el.dataset.addpropscene){
    const p = propOf(el.dataset.addpropscene);
    const sid = el.value;
    if(p && sid){ p.scenes.push(sid); ensurePmarks(); save(); render(); }
    return;
  }
  if(el.dataset.addprop){
    const p = propOf(el.value);
    if(p){ p.scenes.push(el.dataset.addprop); ensurePmarks(); save(); render(); }
    return;
  }

  const k = el.dataset.k, f = el.dataset.f;
  if(!k || !f) return;
  const o = objFor(k, el.dataset.i);
  if(!o) return;
  o[f] = el.type==='number' ? Number(el.value) : el.value;
  save();
  if(el.tagName==='SELECT') render();
});

document.addEventListener('input', e=>{
  if(e.target && e.target.id === 'dir-input') UI.dirText = e.target.value;
});
document.addEventListener('keydown', e=>{
  if(e.target && e.target.id === 'dir-input' && (e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    e.preventDefault(); e.stopPropagation();
    runDirections();
  }
}, true);

/* ---------- move tokens around the floor ---------- */
let tokDrag = null;
let selected = null;
let pathMode = null;
const moveStack = [];
let runScene = null, runAnim = null;
let runPositions = {};

function rememberDelete(label, before, scene){
  deleteStack.push({label, before, scene});
  if(deleteStack.length > 20) deleteStack.shift();
  lastDeleteAt = Date.now();
}

function undoDelete(){
  if(!deleteStack.length){ toast(T('Nothing to restore.')); return; }
  const d = deleteStack.pop();
  try{
    S = JSON.parse(d.before);
    ensureApps();
    normalise();
    if(d.scene && sceneOf(d.scene)) UI.scene = d.scene;
    persist(); render();
    const left = deleteStack.length;
    toast(left ? T('Restored {label} — {n} more deletes to undo.', {label:d.label, n:left}) : T('Restored {label}.', {label:d.label}));
  }catch(e){ toast(T('Could not restore that delete.')); }
}

function zoneLabel(x, y){
  const row = y < 33 ? 'US' : y < 67 ? 'CS' : 'DS';
  const col = x < 33 ? 'R'  : x < 67 ? 'C'  : 'L';
  return row + '-' + col;
}

function updateReadout(x, y){
  const el = document.getElementById('stage-readout');
  if(!el) return;
  if(x == null){ el.textContent = T('free floor'); el.style.opacity = '.6'; return; }
  el.textContent = zoneLabel(x, y) + ' · ' + Math.round(x) + ' / ' + Math.round(y);
  el.style.opacity = '1';
}

function applySelection(){
  document.querySelectorAll('.actor-token,.prop-token').forEach(el=>{
    const on = !!selected && el.dataset.kind === selected.kind && el.dataset.id === selected.id;
    el.classList.toggle('sel', on);
  });
}

function syncToken(kind, id, x, y){
  const el = document.querySelector('[data-kind="' + kind + '"][data-id="' + id + '"]');
  if(el){ const v = tf(x, y); el.style.left = v.x + '%'; el.style.top = v.y + '%'; }
}

let lastMoveAt = 0;
function pushMove(kind, id, prev, batch){
  if(kind === 'cast' && !('on' in prev)){
    const a = appOf(UI.scene, id);
    if(a) prev.on = a.on;
  }
  moveStack.push({kind, id, scene:UI.scene, prev, batch: batch === undefined ? 0 : batch});
  lastMoveAt = Date.now();
  if(moveStack.length > 40) moveStack.shift();
}

function undoMove(){
  if(!moveStack.length){ toast(T('Nothing to undo.')); return; }
  const m = moveStack.pop();
  if(m.kind === 'cast'){
    const a = appOf(m.scene, m.id);
    if(a){ a.x = m.prev.x; a.y = m.prev.y; if('on' in m.prev) a.on = m.prev.on; }
  } else {
    const mk = pmarksIn(m.scene).find(k=>k.prop === m.id);
    if(mk){ mk.x = m.prev.x; mk.y = m.prev.y; }
  }
  save();
  if(UI.view === 'stage') render();
  toast(T('Move undone.'));
}

function nudge(dx, dy){
  if(!selected) return;
  if(selected.kind === 'cast'){
    const a = appOf(UI.scene, selected.id);
    if(!a) return;
    pushMove('cast', selected.id, {x:a.x, y:a.y});
    const p1 = clampDisc(a.x + dx, a.y + dy);
    a.x = p1.x; a.y = p1.y;
    syncToken('cast', selected.id, a.x, a.y);
    updateReadout(a.x, a.y);
  } else {
    const m = pmarksIn(UI.scene).find(k=>k.prop === selected.id);
    if(!m) return;
    pushMove('prop', selected.id, {x:m.x, y:m.y});
    const p2 = clampDisc(m.x + dx, m.y + dy);
    m.x = p2.x; m.y = p2.y;
    syncToken('prop', selected.id, m.x, m.y);
    updateReadout(m.x, m.y);
  }
  save();
  refreshPathUI();
}

document.addEventListener('pointerdown', e=>{
  const canvas = document.getElementById('stage-canvas');
  if(!canvas) return;
  if(pathMode && canvas.contains(e.target)){
    e.preventDefault();
    addPathPoint(e.clientX, e.clientY, canvas);
    return;
  }
  const el = e.target.closest('.actor-token,.prop-token');
  if(!el || !canvas.contains(el)){
    if(pathMode) return;
    if(selected){ selected = null; applySelection(); refreshPathUI(); }
    return;
  }
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const box = el.getBoundingClientRect();
  tokDrag = {
    el, kind: el.dataset.kind, id: el.dataset.id, r, moved: false,
    sx: e.clientX, sy: e.clientY, x: null, y: null,
    offX: e.clientX - (box.left + box.width / 2),
    offY: e.clientY - (box.top + box.height / 2)
  };
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.classList.add('dragging');
});

document.addEventListener('pointermove', e=>{
  if(!tokDrag) return;
  const r = tokDrag.r;
  const vx = ((e.clientX - tokDrag.offX - r.left) / r.width) * 100;
  const vy = ((e.clientY - tokDrag.offY - r.top) / r.height) * 100;
  const dz = tfBack(vx, vy);
  const raw = clampDisc(dz.x, dz.y);
  const x = raw.x, y = raw.y;
  if(Math.abs(e.clientX - tokDrag.sx) > 3 || Math.abs(e.clientY - tokDrag.sy) > 3) tokDrag.moved = true;
  tokDrag.x = x; tokDrag.y = y;
  const vp = tf(x, y);
  tokDrag.el.style.left = vp.x + '%';
  tokDrag.el.style.top  = vp.y + '%';
  updateReadout(x, y);
});

function endTokenDrag(){
  if(!tokDrag) return;
  const d = tokDrag;
  tokDrag = null;
  d.el.classList.remove('dragging');

  selected = {kind:d.kind, id:d.id};
  applySelection();
  refreshPathUI();

  if(!d.moved){
    if(d.kind === 'cast'){
      const a = appOf(UI.scene, d.id);
      if(a) updateReadout(a.x, a.y);
    } else {
      const m = pmarksIn(UI.scene).find(k=>k.prop === d.id);
      if(m) updateReadout(m.x, m.y);
    }
    return;
  }
  if(d.x == null) return;

  if(d.kind === 'cast'){
    const a = appOf(UI.scene, d.id);
    if(a){
      pushMove('cast', d.id, {x:a.x, y:a.y});
      a.x = d.x; a.y = d.y; a.on = true;
    }
  } else {
    const m = pmarksIn(UI.scene).find(k=>k.prop === d.id);
    if(m){ pushMove('prop', d.id, {x:m.x, y:m.y}); m.x = d.x; m.y = d.y; }
  }
  save();
}
document.addEventListener('pointerup', endTokenDrag);
document.addEventListener('pointercancel', endTokenDrag);

/* ---------- direction engine: type a note, the floor moves ---------- */
const ROW_WORDS = [['upstage', 26], ['downstage', 63], ['centre', 50], ['center', 50],
                   ['middle', 50], ['mid', 50], ['front', 63], ['back', 26]];
let dirRunning = false, dirBatch = 0;

function tokenEl(kind, id){
  return document.querySelector('[data-kind="' + kind + '"][data-id="' + id + '"]');
}

function dirCastIndex(){
  const idx = [];
  S.cast.forEach(c=>{
    idx.push([c.name.toLowerCase(), c]);
    c.role.toLowerCase().split(/[\/,&／，]+|\band\b|和|、|及|与/).forEach(pt=>{
      let t = pt.trim();
      if(t.length > 1){
        idx.push([t, c]);
        if(t.indexOf('the ') === 0) idx.push([t.slice(4).trim(), c]);
      }
    });
  });
  return idx.sort((a,b)=>b[0].length - a[0].length);
}

function dirMatch(text){
  const found = [];
  let rest = ' ' + text.toLowerCase().replace(/[’']s\b/g, '') + ' ';
  dirCastIndex().forEach(([key,c])=>{
    if(found.indexOf(c.id) >= 0) return;
    const esc = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(^|[^a-z])' + esc + '([^a-z]|$)');
    if(re.test(rest)){ found.push(c.id); rest = rest.replace(re, '$1 '); }
  });
  return found;
}

function dirIntent(text){
  const t = ' ' + text.toLowerCase() + ' ';
  const exit  = /\b(exit|exits|exiting|leave|leaves|clears?|clear the|out)\b/.test(t)
             || /(退场|下场|离场|退出|下台|离开|出去)/.test(t);
  const enter = /\b(enter|enters|entrance|come on|comes on|come in|comes in)\b/.test(t)
             || /(上场|入场|登台|上台|进场|登场|出来)/.test(t);
  let row = null;
  ROW_WORDS.forEach(([w,y])=>{ if(row == null && new RegExp('\\b' + w + '\\b').test(t)) row = y; });
  if(row == null){
    const cnRows = [['后区',26],['后场',26],['后方',26],['舞台后',26],['后',26],
                    ['前区',63],['前场',63],['前方',63],['舞台前',63],['前',63],
                    ['中间',50],['中央',50],['中区',50],['中',50]];
    for(const [w,y] of cnRows){ if(t.indexOf(w) >= 0){ row = y; break; } }
  }
  let col = 0;
  /* ground plan: back wall at the top, audience at the bottom. Stage left is
     therefore the right side of the page; house left is the audience's side. */
  if(/\bhouse left\b/.test(t) || /(观众左|观众席左)/.test(t)) col = -1;
  else if(/\bstage left\b/.test(t) || /(舞台左|台左|左)/.test(t)) col = 1;
  else if(/\bleft\b/.test(t)) col = 1;
  else if(/\bhouse right\b/.test(t) || /(观众右|观众席右)/.test(t)) col = 1;
  else if(/\bstage right\b/.test(t) || /(舞台右|台右|右)/.test(t)) col = -1;
  else if(/\bright\b/.test(t)) col = -1;
  return {exit, enter, row, col, any: row != null || col !== 0};
}

function compileDirections(raw){
  const lines = raw.split(/[\n\r;]+/).map(x=>x.trim().replace(/^[-•*\u2022]\s*/,'').replace(/^\d+[\.\)]\s*/,'')).filter(Boolean);
  return lines.map(line=>{
    const lower = line.toLowerCase();
    const whole = /\b(everyone|everybody|all|company|whole cast|the cast)\b/.test(lower)
                || /(所有人|全体|大家|全部|全员|剧组)/.test(lower);
    if(whole){
      const it = dirIntent(line);
      const ids = onStage(UI.scene).map(p=>p.cast.id);
      if(it.exit) return {line, ids, mode:'exit', ok:true};
      if(/\b(marks|mark|places|reset|arrange|tidy|line up)\b/.test(lower) || /(回位|归位|就位|标记点|集合|排位|整理)/.test(lower)) return {line, ids, mode:'layout', ok:true};
      return {line, ids, mode:'move', row: it.row != null ? it.row : 46, col: it.col, ok:true};
    }
    const ids = dirMatch(line);
    if(!ids.length) return {line, ids:[], mode:'—', ok:false, note:T('no character I recognise')};
    const it = dirIntent(line);
    if(it.exit)  return {line, ids, mode:'exit', ok:true};
    if(!it.any && !it.enter) return {line, ids, mode:'—', ok:false, note:T('name a place — “to downstage left”')};
    return {line, ids, mode: it.enter ? 'enter' : 'move', row:it.row, col:it.col, ok:true};
  });
}

function stepTarget(a, st){
  const y = st.row != null ? st.row : (st.mode === 'enter' ? 46 : a.y);
  const sp = discSpan(y);
  const x = st.col ? 50 + st.col * 0.84 * sp : (st.row != null && a.on ? a.x : 50);
  return clampDisc(x, y);
}

function animateToken(kind, id, x, y, ms, op){
  const el = tokenEl(kind, id);
  if(!el) return;
  const v = tf(x, y);
  el.style.transition = 'left ' + ms + 'ms cubic-bezier(.33,.02,.24,1), top ' + ms + 'ms cubic-bezier(.33,.02,.24,1)'
                      + (op != null ? ', opacity .45s linear' : '');
  el.style.left = v.x + '%';
  el.style.top  = v.y + '%';
  if(op != null) el.style.opacity = String(op);
}

function spawnToken(a){
  const canvas = document.getElementById('stage-canvas');
  const c = S.cast.find(x=>x.id === a.cast);
  if(!canvas || !c) return null;
  const tmp = document.createElement('div');
  tmp.innerHTML = tokCast({cast:c, x:a.x, y:a.y});
  const el = tmp.firstElementChild;
  if(!el) return null;
  el.style.opacity = '0';
  canvas.appendChild(el);
  return el;
}

function execStep(st, done){
  const scene = UI.scene, ms = 820;
  if(st.mode === 'layout'){
    const before = onStage(scene).map(p=>({id:p.cast.id, x:p.x, y:p.y}));
    layoutScene(scene);
    before.forEach(b=>pushMove('cast', b.id, {x:b.x, y:b.y, on:true}, dirBatch));
    onStage(scene).forEach(p=>{ const a = appOf(scene, p.cast.id); if(a) animateToken('cast', a.cast, a.x, a.y, ms); });
    setTimeout(()=>{ save(); done(); }, ms + 80);
    return;
  }
  const ids = st.ids.filter(id=>appOf(scene, id));
  ids.forEach((id, n)=>{
    setTimeout(()=>{
      const a = appOf(scene, id);
      if(!a) return;
      if(st.mode === 'exit'){
        pushMove('cast', id, {x:a.x, y:a.y, on:true}, dirBatch);
        animateToken('cast', id, a.x < 50 ? -14 : 114, a.y + 5, ms, 0);
        a.on = false;
        return;
      }
      const t = stepTarget(a, st);
      if(!a.on){
        pushMove('cast', id, {x:a.x, y:a.y, on:false}, dirBatch);
        a.on = true;
        a.x = t.x < 50 ? -12 : 112;
        a.y = t.y;
        spawnToken(a);
        requestAnimationFrame(()=>animateToken('cast', id, t.x, t.y, ms, 1));
      } else {
        pushMove('cast', id, {x:a.x, y:a.y, on:a.on}, dirBatch);
        a.x = t.x; a.y = t.y; a.on = true;
        animateToken('cast', id, t.x, t.y, ms);
      }
    }, n * 95);
  });
  setTimeout(()=>{ save(); done(); }, ids.length * 95 + ms + 100);
}

function dirLine(st){
  const mark = st.ok ? '→' : '·';
  return '<div class="dirline"><span class="mk" style="' + (st.ok ? '' : 'opacity:.45') + '">' + mark + '</span>' +
         '<span><b>' + esc(st.line) + '</b>' + (st.note ? ' <span style="color:var(--dim2)">— ' + esc(st.note) + '</span>' : '') + '</span></div>';
}

function runDirections(){
  if(dirRunning){ toast(T('Still moving — give it a second.')); return; }
  const box = document.getElementById('dir-input');
  if(!box || !box.value.trim()){
    toast(T('Write a direction first, e.g. “Puck crosses to downstage left”.'));
    if(box) box.focus();
    return;
  }
  const steps = compileDirections(box.value);
  const out = document.getElementById('dir-out');
  if(!steps.length) return;
  const runnable = steps.filter(s=>s.ok);
  if(!runnable.length){
    if(out) out.innerHTML = steps.map(dirLine).join('');
    return;
  }
  dirRunning = true;
  dirBatch += 1;
  const btn = document.querySelector('[data-act="runmove"]');
  if(btn){ btn.disabled = true; btn.textContent = T('Moving…'); }
  if(out) out.innerHTML = '';
  let i = 0, moved = 0;
  const tick = ()=>{
    if(i >= steps.length){
      dirRunning = false;
      if(btn){ btn.disabled = false; btn.textContent = T('Run moves'); }
      save(); render();
      const o = document.getElementById('dir-out');
      if(o) o.innerHTML = steps.map(dirLine).join('');
      toast(moved ? T('Blocking updated — {n}.', {n:pl(moved,'move')}) : T('Nothing to move.'));
      return;
    }
    const st = steps[i++];
    if(!st.ok){ setTimeout(tick, 70); return; }
    if(out) out.insertAdjacentHTML('beforeend', dirLine(st));
    execStep(st, ()=>{ moved += st.ids.length; setTimeout(tick, 130); });
  };
  tick();
}

function undoRun(){
  if(!moveStack.length){ toast(T('Nothing to undo.')); return; }
  const b = moveStack[moveStack.length-1].batch;
  if(!b){ toast(T('No moves from Run to undo.')); return; }
  let n = 0;
  while(moveStack.length && moveStack[moveStack.length-1].batch === b){
    const m = moveStack.pop(); n++;
    if(m.kind === 'cast'){
      const a = appOf(m.scene, m.id);
      if(a){ a.x = m.prev.x; a.y = m.prev.y; if('on' in m.prev) a.on = m.prev.on; }
    } else {
      const mk = pmarksIn(m.scene).find(k=>k.prop === m.id);
      if(mk){ mk.x = m.prev.x; mk.y = m.prev.y; }
    }
  }
  save(); render();
  toast(T('{n} undone.', {n:pl(n,'move')}));
}

/* keyboard: nudge, undo, deselect */
document.addEventListener('keydown', e=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;

  if((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')){
    if(deleteStack.length && (!moveStack.length || lastDeleteAt > lastMoveAt)){ e.preventDefault(); undoDelete(); }
    else if(UI.view === 'stage' && moveStack.length){ e.preventDefault(); undoMove(); }
    return;
  }
  if(e.key === 'Escape' && UI.view === 'stage'){ selected = null; pathMode = null; applySelection(); refreshPathUI(); return; }
  if(UI.view !== 'stage' || !selected) return;

  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(selected.kind === 'cast'){ e.preventDefault(); sendToWings(selected.id); }
    return;
  }
  const step = e.shiftKey ? 5 : 1;
  let dx = 0, dy = 0;
  if(e.key === 'ArrowLeft') dx = -step;
  else if(e.key === 'ArrowRight') dx = step;
  else if(e.key === 'ArrowUp') dy = -step;
  else if(e.key === 'ArrowDown') dy = step;
  if(!dx && !dy) return;
  e.preventDefault();
  nudge(dx, dy);
});

document.addEventListener('keydown', e=>{
  if(UI.view!=='run' || e.repeat) return;
  if(e.code==='Space' && !(document.activeElement && document.activeElement.tagName==='BUTTON')){ e.preventDefault(); goNext(); }
  if(e.key==='Escape'){ go('cuebook'); }
});

setInterval(()=>{
  const el = document.getElementById('run-elapsed');
  if(el && UI.view==='run' && UI.started) el.textContent = fmtClock(Date.now()-UI.started);
}, 1000);

render();
if(loadNotice) toast(T('Saved data was unreadable — started from the demo. A copy is kept in this browser.'));
</script>
</body>
</html>
