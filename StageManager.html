<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage Manager — Rehearsal &amp; Cue Book</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --bg:#f3f0ea; --paper:#ffffff; --soft:#faf8f4; --soft2:#f5f2ec;
  --line:#e6e1d8; --line2:#d3cdc1;
  --ink:#23252b; --dim:#6e7580; --dim2:#9aa0a9;
  --accent:#a33a31; --accent2:#c2554a; --accent-soft:#f8eae7;
  --blue:#2f6bb0; --blue-soft:#e9f1fa;
  --green:#2f7f5b; --green-soft:#e8f4ee;
  --amber:#a97318; --amber-soft:#fbf2dd;
  --red:#b03a3a; --red-soft:#fbeaea;
  --purple:#6b4fb8;
  --shadow:0 1px 2px rgba(40,32,24,.05), 0 8px 24px -18px rgba(40,32,24,.35);
  --sans:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,"PingFang SC",sans-serif;
  --serif:ui-serif,"Iowan Old Style",Georgia,"Songti SC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(1100px 620px at 6% -14%,rgba(163,58,49,.07),transparent 66%),
  radial-gradient(900px 520px at 102% -6%,rgba(47,107,176,.06),transparent 62%)}
.app{display:flex;height:100vh;position:relative}

/* ---------- rail ---------- */
.rail{width:236px;flex:0 0 236px;border-right:1px solid var(--line);background:#fbf9f5;display:flex;flex-direction:column;padding:22px 16px}
.brand{display:flex;gap:12px;align-items:center;padding:2px 6px 22px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line2);color:var(--accent);font:600 13px/1 var(--mono);display:grid;place-items:center;letter-spacing:.08em;box-shadow:var(--shadow)}
.brand h1{font:600 15px/1.2 var(--sans);letter-spacing:-.01em}
.brand p{font-size:10px;color:var(--dim2);letter-spacing:.09em;text-transform:uppercase;margin-top:4px}
nav#nav{display:flex;flex-direction:column;gap:3px}
.navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:none;color:var(--dim);border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;transition:.15s;position:relative}
.navbtn:hover{background:var(--soft2);color:var(--ink)}
.navbtn.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,32,24,.09)}
.navbtn.on::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--accent)}
.navbtn .n{font:10px/1 var(--mono);color:var(--dim2);width:16px;flex:0 0 16px}
.navbtn.on .n{color:var(--accent)}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:18px}
.rail-foot .label{font-size:9.5px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;margin-bottom:7px}
.rail-foot .rs-title{font-size:12.5px;color:var(--dim);line-height:1.55}
.rail-actions{display:flex;gap:7px;margin-top:14px}
.mini{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--dim);font:11px/1 var(--sans);cursor:pointer;transition:.14s}
.mini:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:76px;flex:0 0 76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);z-index:5}
.tb-eyebrow{font:9.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tb-title{font:600 19px/1.2 var(--serif);letter-spacing:-.01em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tb-right{display:flex;align-items:center;gap:14px}
.save{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim2);white-space:nowrap}
.save .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:34px 40px 70px}
.wrap{max-width:1240px;margin:0 auto;min-width:0}
.scene-detail>*{min-width:0}

/* ---------- atoms ---------- */
.btn{padding:10px 17px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--ink);font:13.5px/1 var(--sans);cursor:pointer;transition:.14s;white-space:nowrap;box-shadow:0 1px 2px rgba(40,32,24,.05)}
.btn:hover{border-color:var(--ink);background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 16px -10px rgba(163,58,49,.9)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.sec{display:block;font:9.5px/1.5 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);margin-bottom:12px}
.h2{font:600 27px/1.15 var(--serif);letter-spacing:-.015em}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.pagehead .desc{font-size:13px;color:var(--dim);margin-top:8px;max-width:56ch}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:10px/1.6 var(--mono);letter-spacing:.04em;border:1px solid;white-space:nowrap}
.b-sfx{color:var(--blue);border-color:#c3d9f0;background:var(--blue-soft)}
.b-lfx{color:var(--amber);border-color:#ecd9ab;background:var(--amber-soft)}
.b-prop{color:var(--green);border-color:#c3e0cf;background:var(--green-soft)}
.b-dim{color:var(--dim);border-color:var(--line2);background:transparent}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.inp,.sel,.ta{text-overflow:ellipsis;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);font:13.5px/1.45 var(--sans);width:100%;transition:.14s}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:80px}
.inp.flat{border-color:transparent;background:transparent;padding:5px 7px}
.inp.flat:hover{border-color:var(--line)}
.inp.flat:focus{border-color:var(--accent);background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft2);border:1px solid var(--line);font-size:11.5px;color:var(--ink)}
.chip .x{cursor:pointer;color:var(--dim2);font-size:12px}
.chip .x:hover{color:var(--red)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
.tbl td{padding:11px 14px;border-bottom:1px solid #efece5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.dim2{color:var(--dim2)}
.empty{padding:40px 14px;text-align:center;color:var(--dim2);font-size:13px}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k{font:9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.kpi .v{font:600 34px/1.1 var(--serif);letter-spacing:-.02em;margin-top:10px}
.kpi .s{font-size:11.5px;color:var(--dim2);margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.cols>*{min-width:0}
.runorder .act{font:9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);padding:18px 20px 8px;cursor:pointer}
.runorder .act:hover{color:var(--accent)}
.srow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid #f1eee7;cursor:pointer}
.srow:hover{background:var(--soft2)}
.srow .num{font:11px/1 var(--mono);color:var(--accent);width:36px;flex:0 0 36px;opacity:.9}
.srow .tt{flex:1;min-width:0}
.srow .tt b{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tt span{font-size:11.5px;color:var(--dim2)}
.warn{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #f1eee7;font-size:13px;line-height:1.5}
.warn:last-child{border:0;padding-bottom:0}
.warn .ic{width:16px;flex:0 0 16px;color:var(--amber);font-size:12px}
.warn b{font-weight:600}

/* ---------- settings ---------- */
.langopts{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.langopt{min-width:190px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;transition:.14s}
.langopt b{display:block;font-size:14px}
.langopt span{display:block;font-size:10.5px;color:var(--dim2);margin-top:3px;letter-spacing:.04em}
.langopt:hover{border-color:var(--line2)}
.langopt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.langopt.on b{color:var(--accent)}

/* ---------- scene tabs ---------- */
.tabsbar{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
.scenetabs{display:flex;gap:22px;overflow-x:auto;padding:2px 2px 0;flex:1;min-width:0}
.scenetabs .actcol{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.scenetabs .actlab{border:0;background:none;padding:0;font:9px/1.4 var(--mono);letter-spacing:.14em;color:var(--dim2);cursor:pointer;text-align:left;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.scenetabs .actlab:hover{color:var(--accent)}
.tabsadd{flex:0 0 auto;margin-top:1px}
.stab{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--dim);font:12px/1.2 var(--sans);cursor:pointer;white-space:nowrap;text-align:left;transition:.14s}
.stab:hover{border-color:var(--ink);color:var(--ink)}
.stab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.stab.plus{border-style:dashed;color:var(--dim2)}

/* ---------- stage canvas ---------- */
.stage-frame{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 12px 0;box-shadow:var(--shadow)}
.stage-band{display:flex;align-items:center;justify-content:space-between;gap:12px;font:9px/1 var(--mono);letter-spacing:.24em;color:#b4aea2;padding:9px 2px 7px}
.stage-band>span:first-child{flex:1;text-align:center}
.scenetabs{max-width:100%}
.stage-canvas{position:relative;height:clamp(370px,42vh,500px);overflow:hidden;touch-action:none;
  border-radius:0 0 50% 50% / 0 0 100% 100%;
  background:radial-gradient(ellipse 96% 192% at 50% 0%, #fffefb 0%, #fbf8f1 62%, #f4f0e8 100%);
  box-shadow:0 0 0 1px #d8d1c4, 0 26px 48px -38px rgba(60,44,30,.5), inset 0 3px 0 rgba(255,255,255,.95)}
.stage-canvas::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    repeating-radial-gradient(ellipse 100% 100% at 50% 0%, transparent 0 32.6%, rgba(0,0,0,.035) 32.6% 32.95%, transparent 32.95% 33%),
    repeating-radial-gradient(ellipse 100% 100% at 50% 0%, transparent 0 65.6%, rgba(0,0,0,.035) 65.6% 65.95%, transparent 65.95% 66%),
    linear-gradient(90deg,transparent 49.7%,rgba(0,0,0,.045) 49.85%,rgba(0,0,0,.045) 50.15%,transparent 50.3%)}
.stage-canvas::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 60px -30px rgba(90,70,50,.28)}
.actor-token{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#fff;
  border:2.5px solid var(--c,#888);box-shadow:0 2px 7px rgba(40,32,24,.16);display:grid;place-items:center;
  font:600 13px/1 var(--sans);color:var(--c,#444);cursor:grab;user-select:none;touch-action:none;transition:box-shadow .14s}
.actor-token:hover{box-shadow:0 6px 18px rgba(40,32,24,.24)}
.actor-token.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(40,32,24,.32);z-index:9}
.actor-token .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font:10.5px/1.3 var(--sans);color:#454a52;white-space:nowrap;background:rgba(255,255,255,.9);border-radius:5px;padding:1px 5px;border:1px solid #ece7de;max-width:98px;overflow:hidden;text-overflow:ellipsis}
.prop-token{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border-radius:10px;max-width:118px;
  background:#fff;border:1px solid #d9d2c5;border-left:3px solid #9a8a6e;font:11px/1.3 var(--sans);color:#3c4046;
  cursor:grab;user-select:none;touch-action:none;max-width:170px;box-shadow:0 1px 4px rgba(40,32,24,.12)}
.prop-token:hover{box-shadow:0 5px 14px rgba(40,32,24,.2)}
.prop-token.dragging{cursor:grabbing;box-shadow:0 12px 26px rgba(40,32,24,.28);z-index:9}
.prop-token .sq{width:8px;height:8px;border-radius:2px;background:#b3a487;flex:0 0 8px}
.prop-token span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- house orientation ---------- */
.stage-canvas.up{border-radius:50% 50% 0 0 / 100% 100% 0 0;
  background:radial-gradient(ellipse 96% 192% at 50% 100%, #fffefb 0%, #fbf8f1 62%, #f4f0e8 100%)}
.stage-canvas.up::before{
  background:
    repeating-radial-gradient(ellipse 100% 100% at 50% 100%, transparent 0 32.6%, rgba(0,0,0,.035) 32.6% 32.95%, transparent 32.95% 33%),
    repeating-radial-gradient(ellipse 100% 100% at 50% 100%, transparent 0 65.6%, rgba(0,0,0,.035) 65.6% 65.95%, transparent 65.95% 66%),
    linear-gradient(90deg,transparent 49.7%,rgba(0,0,0,.045) 49.85%,rgba(0,0,0,.045) 50.15%,transparent 50.3%)}
.floorwrap.up{border-radius:50% 50% 0 0 / 100% 100% 0 0;
  background:radial-gradient(ellipse 96% 192% at 50% 100%,#fffefb,#f6f2ea)}
.segs{display:flex;flex-direction:row;flex-wrap:nowrap;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#fff;flex:0 0 auto}
.segs button{flex:0 0 auto;border:0;border-right:1px solid var(--line2);background:transparent;padding:6px 9px;font:11px/1.45 var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap;line-height:1.2}
.segs button:last-child{border-right:0}
.segs button:hover{background:var(--soft2)}
.segs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.facegrp{display:flex;align-items:center;gap:7px}
.facegrp .k{font:9px/1 var(--mono);letter-spacing:.16em;color:var(--dim2)}
.stagebar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 20px;box-shadow:var(--shadow)}
.stagebar .grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stagebar .grp .k{font:9px/1 var(--mono);letter-spacing:.16em;color:var(--dim2)}
.stagebar .grp.inline{flex-direction:row;align-items:center;gap:8px}
.stagebar .grp.inline .k{margin-right:2px}
.stagebar .spacer{flex:1 1 auto}

.actor-token.sel{box-shadow:0 0 0 4px var(--accent-soft),0 0 0 5px rgba(163,58,49,.34),0 7px 20px rgba(40,32,24,.18)}
.prop-token.sel{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px rgba(163,58,49,.3),0 5px 14px rgba(40,32,24,.14)}
.stage-readout{font:10px/1.3 var(--mono);letter-spacing:.08em;color:#7a7266;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:7px;padding:4px 8px;pointer-events:none;opacity:.66;transform:none}
.stage-hint{font-size:11.5px;color:var(--dim2);margin-top:12px;line-height:1.6}
.scene-detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.side{min-width:0;display:flex;flex-direction:column;gap:16px}

.dirbox{width:100%;min-height:92px;resize:vertical;font:12.5px/1.62 var(--sans);border-radius:10px}
.dirbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dirchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.dirchip{padding:4px 10px;border-radius:20px;border:1px solid var(--line2);background:#fff;font:10.5px/1.55 var(--sans);color:var(--dim);cursor:pointer;white-space:nowrap}
.dirchip:hover{border-color:var(--accent);color:var(--accent)}
.dirout{margin-top:11px;display:flex;flex-direction:column;gap:4px}
.dirline{display:flex;gap:6px;font:11px/1.45 var(--sans);color:var(--dim);align-items:baseline}
.dirline .mk{flex:0 0 10px;color:var(--accent)}
.dirline b{color:var(--ink);font-weight:600}
.path-layer-host{position:absolute;inset:0;pointer-events:none;z-index:0}
.path-layer{width:100%;height:100%;display:block;overflow:visible}
.path-line{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 3;opacity:.6;stroke-linejoin:round;stroke-linecap:round}
.path-line.recording{stroke-dasharray:2 2;opacity:.95}
.path-dot{fill:#fff;stroke:var(--accent);stroke-width:1.2;opacity:.85}
.path-dot.recording{fill:var(--accent);stroke:#fff}
.path-num{position:absolute;transform:translate(-50%,-50%);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font:9px/16px var(--mono);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none}
.stage-canvas.recording{box-shadow:0 0 0 2px rgba(163,58,49,.55), 0 26px 48px -38px rgba(60,44,30,.5), inset 0 3px 0 rgba(255,255,255,.95)}
/* side panel rows */
.sp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1eee7}
.sp-row:last-child{border-bottom:0}
.sp-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--c,#888);display:grid;place-items:center;font:600 10px/1 var(--sans);color:var(--c,#444);flex:0 0 30px;background:#fff}
.sp-main{flex:1;min-width:0}
.sp-main b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-main span{font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sp-btn{padding:4px 9px;border-radius:7px;border:1px solid var(--line2);background:#fff;color:var(--dim);font:10.5px/1.4 var(--sans);cursor:pointer;flex:0 0 auto}
.sp-btn:hover{border-color:var(--accent);color:var(--accent)}
.sp-btn.solid{background:var(--soft2);border-color:var(--line2)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.cue-mini{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f1eee7;font-size:12.5px}
.cue-mini:last-child{border:0}
.cue-mini .no{font:10px/1.8 var(--mono);color:var(--dim2);flex:0 0 38px}
.cue-mini .tx{flex:1;line-height:1.5}

/* ---------- live board (backstage) ---------- */
.live{max-width:1160px;margin:0 auto;padding-bottom:112px}
.livehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.livehead .tag{font:10px/1 var(--mono);letter-spacing:.2em;color:var(--dim2);text-transform:uppercase}
.livehead h2{font:600 30px/1.15 var(--serif);letter-spacing:-.01em;margin:7px 0 5px}
.livehead .sub{font-size:12.5px;color:var(--dim)}
.liveclock{text-align:right;min-width:86px}
.liveclock .k{font:9px/1 var(--mono);letter-spacing:.16em;color:var(--dim2);margin-bottom:7px}

  .screen-only{display:none!important}

/* free positions: 0–100 of the stage canvas */
function normalise(){
  if(!Array.isArray(S.pmarks)) S.pmarks = [];
  if(!Array.isArray(S.apps)) S.apps = [];
  /* remember which scenes already had blocking before filling missing coords */
  const hadPos = {};
  S.apps.forEach(a=>{ if(a.x!=null && a.y!=null) hadPos[a.scene] = true; });
  const dup = {};
  const fresh = {};
  S.apps.forEach(a=>{
    if(a.x==null || a.y==null){
      fresh[a.scene] = true;
      const z = ZONE_XY[a.zone] || [50,54];
      const key = a.scene + '|' + z[0];
      dup[key] = (dup[key]||0) + 1;
      a.x = Math.max(8, Math.min(92, z[0] + (dup[key]-1)*9));
      a.y = Math.max(10, Math.min(90, z[1] + ((dup[key]-1)%2)*13));
    }
  });
  ensurePmarks();
  /* only lay out a scene that had no positions at all; never disturb saved blocking */
  Object.keys(fresh).forEach(sc=>{ if(!hadPos[sc] && onStage(sc).length) layoutScene(sc); });
  /* older saves may sit outside the half-round floor — pull them back inside */
  S.apps.forEach(a=>{ if(a.x != null && a.y != null){ const p = clampDisc(a.x, a.y); a.x = p.x; a.y = p.y; } });
  S.pmarks.forEach(m=>{ const p = clampDisc(m.x, m.y); m.x = p.x; m.y = p.y; });
  S.apps.forEach(a=>{
    if(a.path != null){
      a.path = cleanPath(a.path);
      if(!a.path.length) delete a.path;
    }
  });
}

/* the floor is a half-disc: widest at the back wall, tapering to the apron tip */
function discHalf(y){ return 50 * Math.sqrt(Math.max(0, 1 - (y/100)*(y/100))); }
function discSpan(y){ return Math.max(4, discHalf(y) - 9.5); }
function clampDisc(x, y){
  y = Math.max(6, Math.min(88, y));
  const sp = discSpan(y);
  return {x: Math.max(50 - sp, Math.min(50 + sp, x)), y};
}
/* paths are ordered points on the floor; keep them finite and inside the curve */
function cleanPath(path){
  if(!Array.isArray(path)) return [];
  return path.slice(0, 30).filter(p=>p && p.x != null && p.y != null && Number.isFinite(Number(p.x)) && Number.isFinite(Number(p.y)))
    .map(p=>{
      const q = clampDisc(Number(p.x), Number(p.y));
      return {x:Math.round(q.x*100)/100, y:Math.round(q.y*100)/100};
    });
}
function pathOf(scene, castId){
  const a = appOf(scene, castId);
  return a && Array.isArray(a.path) ? a.path : [];
}

function tfBack(x, y){

}

  if(!UI.auto || !fromId || !toId || fromId === toId) return;

function playMove(){
  if(!pendingFrom) return;
  const from = pendingFrom; pendingFrom = null;
  const dur = MOVE_SPEED[UI.speed] != null ? MOVE_SPEED[UI.speed] : 1.5;
  const nodes = document.querySelectorAll('#stage-canvas .actor-token, #live-main .ltok');
  const runCue = UI.view === 'run' ? currentRunCue() : null;
  const pathIds = new Set(runCue ? onStage(runCue.scene).filter(p=>{
    const a = appOf(runCue.scene, p.cast.id);
    return a && Array.isArray(a.path) && a.path.length;
  }).map(p=>p.cast.id) : []);
  Array.from(nodes).filter(el=>el.dataset.id).forEach((el, i)=>{
    if(el.closest('#live-main') && pathIds.has(el.dataset.id)) return;
    const tx = parseFloat(el.style.left), ty = parseFloat(el.style.top);
    if(isNaN(tx) || isNaN(ty)) return;
    const f = from[el.dataset.id];
    const start = f ? tf(f.x, f.y) : {x: tx < 50 ? -8 : 108, y: ty};
    el.style.transition = 'none';
    el.style.left = start.x + '%';
    el.style.top  = start.y + '%';
    el.style.opacity = f ? '1' : '.25';
    void el.offsetWidth;
    setTimeout(()=>{
      el.style.transition = 'left ' + dur + 's cubic-bezier(.22,.61,.36,1), top ' + dur +
                            's cubic-bezier(.22,.61,.36,1), opacity ' + (dur * .55) + 's ease';
      el.style.left = tx + '%';
      el.style.top  = ty + '%';
      el.style.opacity = '1';
    }, 30 + i * 55);
  });
}

/* walk everybody in from the wings to their marks */
function lineUp(){
  const dur = MOVE_SPEED[UI.speed] != null ? MOVE_SPEED[UI.speed] : 1.5;
  Array.from(document.querySelectorAll('#stage-canvas .actor-token')).forEach((el, i)=>{
    const tx = parseFloat(el.style.left), ty = parseFloat(el.style.top);
    if(isNaN(tx) || isNaN(ty)) return;
    el.style.transition = 'none';
    el.style.left = (tx < 50 ? -9 : 109) + '%';
    el.style.top  = ty + '%';
    el.style.opacity = '.3';
    void el.offsetWidth;
    setTimeout(()=>{
      el.style.transition = 'left ' + dur + 's cubic-bezier(.22,.61,.36,1), top ' + dur +
                            's cubic-bezier(.22,.61,.36,1), opacity ' + (dur * .45) + 's ease';
      el.style.left = tx + '%';
      el.style.top  = ty + '%';
      el.style.opacity = '1';
    }, 40 + i * 90);
  });
  toast(T('Lining up from the wings.'));
}

function layoutScene(scene){
  const list = S.apps.filter(a=>a.scene===scene && a.on && a.x!=null);
  const n = list.length;
  if(!n) return;
  const rows = n <= 4 ? 1 : n <= 8 ? 2 : n <= 12 ? 3 : 4;
  const ys   = rows === 1 ? [52] : rows === 2 ? [40,66] : rows === 3 ? [30,48,66] : [26,40,54,68];
  const per  = Math.ceil(n / rows);
  list.forEach((a,i)=>{
    const r = Math.min(rows - 1, Math.floor(i / per));
    const cnt = Math.min(per, n - r * per);
    const y = ys[r];
    const sp = Math.max(6, Math.min(discHalf(y) - 6.5, discHalf(Math.min(y + 6.5, 100)) - 8.5));
    const x = cnt === 1 ? 50 : 50 - sp + (2 * sp) * (i % per) / (cnt - 1);
    const p = clampDisc(x, y);
    a.x = p.x; a.y = p.y;
  });
}

function layoutProps(scene){
  const marks = pmarksIn(scene);
  const per = 4;
  marks.forEach((m,i)=>{
    const r = Math.floor(i / per);
    const cnt = Math.min(per, marks.length - r*per);
    const y = 7.4 + r * 8;
    const sp = Math.max(4, discHalf(y) - 12);
    const x = cnt === 1 ? 50 : 50 - sp + (2*sp) * (i % per) / (cnt - 1);
    m.x = Math.max(50 - sp, Math.min(50 + sp, x));
    m.y = y;
  });
}

function pmarksIn(scene){
  return (S.pmarks||[]).filter(m=>m.scene===scene && propOf(m.prop));
}

function ensurePmarks(){
  if(!Array.isArray(S.pmarks)) S.pmarks = [];
  S.pmarks = S.pmarks.filter(m=>{
    const prop = propOf(m.prop);
    return prop && prop.scenes.includes(m.scene);
  });
  const added = S.pmarks.filter(m=>m.x==null || m.y==null);
  sceneList().forEach(sc=>{
    propsIn(sc.id).forEach(prop=>{
      if(!S.pmarks.some(m=>m.scene===sc.id && m.prop===prop.id)){
        const m = {scene:sc.id, prop:prop.id, x:null, y:null};
        S.pmarks.push(m);
        added.push(m);
      }
    });
  });
  /* place only the new marks, in the same back-wall rows layoutProps uses */
  added.forEach(m=>{
    const marks = S.pmarks.filter(x=>x.scene===m.scene);
    const i = marks.indexOf(m);
    const per = 4;
    const y = 7.4 + Math.floor(i/per) * 8;
    const sp = Math.max(4, discHalf(y) - 12);
    const cnt = Math.min(per, marks.length - Math.floor(i/per)*per);
    const x = cnt === 1 ? 50 : 50 - sp + (2*sp) * (i % per) / (cnt - 1);
    m.x = Math.max(50 - sp, Math.min(50 + sp, x));
    m.y = y;
  });
}

/* A backup is only useful if its shape can actually be rendered. Keep the
   checks here so a stale or hand-edited file cannot replace a working show. */
function normaliseShow(s){
  if(!s || typeof s !== 'object' || !s.show || typeof s.show !== 'object') return null;
  if(!['acts','scenes','cast','props','cues'].every(k=>Array.isArray(s[k]))) return null;
  if(!Array.isArray(s.apps)) s.apps = [];
  if(!Array.isArray(s.pmarks)) s.pmarks = [];
  if(s.acts.some(a=>!a || typeof a.id !== 'string')) return null;
  if(s.scenes.some(sc=>!sc || typeof sc.id !== 'string' || typeof sc.title !== 'string' || !s.acts.some(a=>a.id===sc.act))) return null;
  if(s.cast.some(c=>!c || typeof c.id !== 'string' || typeof c.role !== 'string' || typeof c.name !== 'string')) return null;
  if(s.props.some(p=>!p || typeof p.id !== 'string' || typeof p.name !== 'string')) return null;
  s.props.forEach(p=>{ if(!Array.isArray(p.scenes)) p.scenes = []; });
  if(s.cues.some(c=>!c || typeof c.id !== 'string' || typeof c.desc !== 'string' || !TYPES[c.type] || !s.scenes.some(sc=>sc.id===c.scene))) return null;
  s.apps = s.apps.filter(a=>a && typeof a === 'object');
  s.pmarks = s.pmarks.filter(m=>m && typeof m === 'object');
  s.apps.forEach(a=>{
    if(a.path != null){
      a.path = cleanPath(a.path);
      if(!a.path.length) delete a.path;
    }
  });
  return s;
}

  return null;
}

function T(s, vars){
  let out = (UI.lang === 'zh' && ZH[s] != null) ? ZH[s] : s;
  if(vars){
    out = out.replace(/\{(\w+)\}/g, function(_, k){
      return vars[k] == null ? '' : String(vars[k]);
    });
  }
  return out;
}
function localizeStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = T(el.dataset.i18n);
  });
}
function setSaveLabel(){
  const el = document.getElementById('save-text');
  if(!el) return;
  el.textContent = lastSavedAt ? T('Saved {time}', {time:lastSavedAt}) : T('Saved locally');
}
function setLanguage(lang){
  const next = lang === 'zh' ? 'zh' : 'en';
  if(next === UI.lang) return;
  UI.lang = next;
  saveUI(); render();
  toast(T('Interface language updated.'));
}

function saveUI(){
  try{
    localStorage.setItem(LS_UI, JSON.stringify({view:UI.view, scene:UI.scene, runIdx:UI.runIdx,
                                                started:UI.started, executed:UI.executed, lang:UI.lang,
                                                face:UI.face, mirror:UI.mirror, auto:UI.auto, speed:UI.speed}));
  }catch(e){}
}

function go(view, scene){
  if(pathMode && (view !== 'stage' || (scene && scene !== pathMode.scene))) pathMode = null;
  if(view === 'stage' && scene && scene !== UI.scene) queueMove(UI.scene, scene);
  UI.view = view;
  try{ selected = (view === 'stage' && !scene) ? selected : null; }catch(err){}
  if(scene) UI.scene = scene;
  saveUI();
  render();
  document.getElementById('view').scrollTop = 0;
}

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(([id,label],i)=>
    `<button class="navbtn ${UI.view===id?'on':''}" data-view="${id}"><span class="n">0${i+1}</span><span class="lab">${esc(T(label))}</span></button>`
  ).join('');
}

function render(){
  const show = S.show;
  if(document.documentElement) document.documentElement.lang = UI.lang === 'zh' ? 'zh-CN' : 'en';
  document.title = T('Stage Manager — Rehearsal & Cue Book');
  localizeStatic();
  setSaveLabel();
  document.getElementById('show-title').textContent = show.title || T('Untitled production');
  document.getElementById('rail-show').innerHTML = esc(show.title||'—') + '<br><span class="dim2">' + esc(show.dates || T('Date TBC')) + '</span>';
  document.getElementById('tb-eyebrow').textContent = T('Production · {venue}', {venue: show.venue || T('Venue TBC')});
  renderNav();
  const views = {overview:viewOverview, stage:viewStage, cast:viewCast, props:viewProps,
                 cues:viewCues, cuebook:viewCueBook, run:viewRun, settings:viewSettings};
  const v = document.getElementById('view');
  v.innerHTML = (views[UI.view] || viewOverview)();
  if(UI.view === 'stage'){
    try{ applySelection(); updateReadout(null); }catch(err){}
  }
  try{ playMove(); }catch(err){}
  if(UI.view === 'run'){
    try{ syncRunMotion(); }catch(err){}
  }
}
/* ==================================================================
   4. VIEW — OVERVIEW
   ================================================================== */
function warnings(){
  const out = [];
  sceneList().forEach(s=>{
    const bad = propsIn(s.id).filter(p=>p.status!=='Ready' && p.status!=='In use');
    if(bad.length) out.push({scene:s.id, text:T('Scene {tag} calls for {props} not ready — {names}', {tag:sceneTag(s.id), props:pl(bad.length,'prop'), names:bad.map(p=>p.name).join(', ')})});
    if(!onStage(s.id).length) out.push({scene:s.id, text:T('Scene {tag} has nobody placed on stage yet.', {tag:sceneTag(s.id)})});
  });
  S.props.forEach(p=>{ if(!p.scenes.length) out.push({scene:null, text:T('Prop “{name}” is not assigned to any scene.', {name:p.name})}); });
  S.cast.forEach(c=>{ if(!castScenes(c.id).length) out.push({scene:null, text:T('{role} ({name}) has no entrance — check the scene breakdown.', {role:c.role, name:c.name})}); });
  return out;
}

function viewOverview(){
  const scenes = sceneList();
  const people = new Set(S.cast.map(c=>c.name)).size;
  const notReady = S.props.filter(p=>p.status!=='Ready' && p.status!=='In use').length;
  const issues = warnings();
  const firstNameCount = {};
  S.cast.forEach(c=>{ firstNameCount[c.name]=(firstNameCount[c.name]||0)+1; });

  const kpis = `
  <div class="kpis">
    <div class="kpi"><div class="k">${T('Scenes')}</div><div class="v">${scenes.length}</div><div class="s">${pl(S.acts.length,'act')} · ${scenes.reduce((n,s)=>n+ (parseInt(s.duration)||0),0)} ${T('min staged')}</div></div>
    <div class="kpi"><div class="k">${T('Company')}</div><div class="v">${people}</div><div class="s">${pl(S.cast.length,'track')} · ${S.cast.length - people + S.cast.filter(c=>/\/|&/.test(c.role)).length} ${T('doubling')}</div></div>
    <div class="kpi"><div class="k">${T('Props tracked')}</div><div class="v">${S.props.length}</div><div class="s">${notReady} ${T('need attention')}</div></div>
    <div class="kpi"><div class="k">${T('Cues')}</div><div class="v">${S.cues.length}</div><div class="s">${T('sound')} ${S.cues.filter(c=>c.type==='SFX').length} · ${T('light')} ${S.cues.filter(c=>c.type==='LFX').length} · ${T('prop')} ${S.cues.filter(c=>c.type==='PROP').length}</div></div>
  </div>`;

  const running = scenes.map(s=>{
    const act = S.acts.find(a=>a.id===s.act);
    return `<div class="srow" data-view="stage" data-scene="${s.id}">
      <span class="num">${act.no}.${s.no}</span>
      <span class="tt"><b>${esc(s.title)}</b><span>${onStage(s.id).length} ${T('on stage')} · ${pl(propsIn(s.id).length,'prop')} · ${pl(cuesIn(s.id).length,'cue')} · ${esc(s.duration||'—')}</span></span>
      <span class="dim2" style="font-size:11px">›</span>
    </div>`;
  });
  // insert act headers
  let lastAct = null, orderHTML = '';
  scenes.forEach((s,i)=>{
    if(s.act!==lastAct){ orderHTML += `<div class="act" data-renameact="${s.act}" title="${T('Rename act')}">${esc(S.acts.find(a=>a.id===s.act).name)}</div>`; lastAct = s.act; }
    orderHTML += running[i];
  });

  const calls = S.cast.map(c=>{
    const sc = castScenes(c.id);
    return `<tr>
      <td style="min-width:0">
        <span class="st"><i style="background:${c.color}"></i><span style="color:var(--text);font-size:12.5px">${esc(c.role)}</span></span>

      </td>
      <td class="mono dim2" style="font-size:11px;text-align:center">${sc.length}</td>
      <td class="mono dim2" style="font-size:10.5px">${sc.length?sceneTag(sc[0].id):'—'}</td>
      <td class="mono dim2" style="font-size:10.5px">${sc.length?sceneTag(sc[sc.length-1].id):'—'}</td>
    </tr>`;
  }).join('');

  const warnHTML = issues.length ? issues.map(w=>`<div class="warn"><span class="ic">▲</span><span>${esc(w.text)}</span></div>`).join('')
    : `<div class="empty">${T('Nothing flagged. Props, placements and calls all line up.')}</div>`;

  return `<div class="wrap">
    <div class="pagehead">
      <div>
        <div class="sec">${T('Production overview')}</div>
        <div class="h2">${esc(S.show.title)}</div>
        <div class="desc">${esc(S.show.notes || T('Add a production note in the details card below.'))}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div class="dim2" style="text-align:right;font-size:11.5px;line-height:1.7;margin-right:4px">
          ${S.show.director?T('Directed by {name}', {name:esc(S.show.director)})+'<br>':''}${esc(S.show.dates||T('Dates TBC'))}
        </div>
        <button class="btn ghost sm" data-act="newshow">${T('New blank show')}</button>
       </div>
    </div>
    ${kpis}
    <div class="cols">
      <div class="card flush runorder">${orderHTML || `<div class="empty">${T('No scenes yet.')}</div>`}</div>
      <div>
        <div class="card flush" style="margin-bottom:14px">
          <div style="padding:16px 16px 4px"><div class="sec">${T('Cast calls')}</div></div>
          <table class="tbl" style="table-layout:fixed"><thead><tr><th style="width:44%">${T('Character · actor')}</th><th style="width:16%;text-align:center">${T('Sc.')}</th><th style="width:20%">${T('In')}</th><th style="width:20%">${T('Out')}</th></tr></thead>
          <tbody>${calls}</tbody></table>
        </div>
        <div class="card">
          <div class="sec">${T('Flags · {n}', {n:issues.length})}</div>
          ${warnHTML}
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="sec">${T('Production details')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label class="sec" style="margin:0 0 5px">${T('Title')}</label><input class="inp" data-k="show" data-f="title" value="${esc(S.show.title)}"></div>
        <div><label class="sec" style="margin:0 0 5px">${T('Venue')}</label><input class="inp" data-k="show" data-f="venue" value="${esc(S.show.venue)}"></div>
        <div><label class="sec" style="margin:0 0 5px">${T('Director')}</label><input class="inp" data-k="show" data-f="director" value="${esc(S.show.director)}"></div>
        <div><label class="sec" style="margin:0 0 5px">${T('Run dates')}</label><input class="inp" data-k="show" data-f="dates" value="${esc(S.show.dates)}"></div>
        <div style="grid-column:1/-1"><label class="sec" style="margin:0 0 5px">${T('Notes')}</label><textarea class="ta" data-k="show" data-f="notes">${esc(S.show.notes)}</textarea></div>
      </div>
    </div>
  </div>`;
}

/* ==================================================================
   5. VIEW — SCENES & VIRTUAL STAGE
   ================================================================== */
function tokCast(p){
  const c = p.cast, v = tf(p.x, p.y);
  return `<span class="actor-token" data-kind="cast" data-id="${c.id}" style="left:${v.x}%;top:${v.y}%;--c:${c.color}" title="${esc(c.role)} — ${esc(c.name)}">${initials(c.name)}<span class="lbl">${esc(c.role.split('/')[0].trim())}</span></span>`;
}

function tokProp(m){
  const pr = propOf(m.prop);
  const nm = pr.name.length > 20 ? pr.name.slice(0,19) + '…' : pr.name;
  const v = tf(m.x, m.y);
  const anchor = v.y > 88 ? 'translate(-50%,-100%)' : (v.y < 10 ? 'translate(-50%,0)' : 'translate(-50%,-50%)');
  return `<span class="prop-token" data-kind="prop" data-id="${pr.id}" style="left:${v.x}%;top:${v.y}%;transform:${anchor}" title="${esc(pr.name)} · x${pr.qty} · ${esc(pr.loc||'')}"><span class="sq"></span><span>${esc(nm)}</span></span>`;
}

/* ---------- recorded movement paths ---------- */
function pathOverlayHTML(){
  if(!selected || selected.kind !== 'cast') return '';
  const a = appOf(UI.scene, selected.id);
  if(!a) return '';
  const rec = !!(pathMode && pathMode.scene === UI.scene && pathMode.cast === selected.id);
  const pts = rec ? pathMode.points : (Array.isArray(a.path) ? a.path : []);
  if(!pts.length) return '';
  const start = a.on ? tf(a.x, a.y) : null;
  const screenPts = pts.map(p=>tf(p.x, p.y));
  const all = start ? [start].concat(screenPts) : screenPts;
  const line = all.map(p=>Number(p.x).toFixed(2) + ',' + Number(p.y).toFixed(2)).join(' ');
  const dots = screenPts.map(p=>`<circle class="path-dot${rec?' recording':''}" cx="${Number(p.x).toFixed(2)}" cy="${Number(p.y).toFixed(2)}" r="${rec?1.5:1.1}" vector-effect="non-scaling-stroke"></circle>`).join('');
  const nums = rec ? screenPts.map((p,i)=>`<span class="path-num" style="left:${p.x}%;top:${p.y}%">${i+1}</span>`).join('') : '';
  return `<svg class="path-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <polyline class="path-line${rec?' recording':''}" points="${line}" vector-effect="non-scaling-stroke"></polyline>${dots}
  </svg>${nums}`;
}

function pathCardBody(){
  const sel = selected;
  const cast = sel && sel.kind === 'cast' ? castOf(sel.id) : null;
  if(!cast) return `<div class="empty" style="padding:16px 0">${T('Select an actor on the floor to record a path.')}</div>`;
  const a = appOf(UI.scene, cast.id);
  const saved = a && Array.isArray(a.path) ? a.path : [];
  const rec = !!(pathMode && pathMode.scene === UI.scene && pathMode.cast === cast.id);
  const who = `<div class="sp-row" style="padding-top:0">
      <span class="sp-dot" style="--c:${cast.color}">${initials(cast.name)}</span>
      <div class="sp-main"><b>${esc(cast.role)}</b><span>${esc(cast.name)}</span></div>
    </div>`;
  if(rec){
    return who + `<div class="stage-hint" style="margin-top:8px">${T('Recording path for {role}. Click the floor to add points.', {role:esc(cast.role)})}</div>
      <div class="dirbar">
        <button class="btn sm" data-path-undo ${pathMode.points.length ? '' : 'disabled'}>${T('Undo point')}</button>
        <button class="btn sm primary" data-path-save>${T('Save path')}</button>
        <button class="btn sm" data-path-cancel>${T('Cancel')}</button>
      </div>
      <div class="dim2" style="font-size:11px;margin-top:8px">${pl(pathMode.points.length,'point')}</div>`;
  }
  const on = !!(a && a.on);
  return who + `<div class="stage-hint" style="margin-top:8px">${saved.length
      ? T('{n} recorded · the path starts from the actor’s current mark.', {n:pl(saved.length,'point')})
      : T('No path recorded for this actor.')}</div>
    ${!on ? `<div class="stage-hint" style="color:var(--amber)">${T('Place the actor on stage first.')}</div>` : ''}
    <div class="dirbar">
      ${saved.length
        ? `<button class="btn sm" data-path-edit ${on ? '' : 'disabled'}>${T('Edit path')}</button>`
        : `<button class="btn sm" data-path-start ${on ? '' : 'disabled'}>${T('Record path')}</button>`}
      ${saved.length ? `<button class="btn sm" data-path-preview ${on ? '' : 'disabled'}>${T('Preview path')}</button>` : ''}
      ${saved.length ? `<button class="btn sm ghost danger" data-path-clear>${T('Clear path')}</button>` : ''}
    </div>
    ${!saved.length ? `<div class="stage-hint" style="margin-top:8px">${T('Click points on the floor to record a path.')}</div>` : ''}`;
}

function refreshPathUI(){
  if(UI.view !== 'stage') return;
  const host = document.getElementById('path-layer-host');
  if(host) host.innerHTML = pathOverlayHTML();
  const card = document.getElementById('path-card');
  if(card) card.innerHTML = pathCardBody();
  const canvas = document.getElementById('stage-canvas');
  if(canvas) canvas.classList.toggle('recording', !!(pathMode && selected && selected.kind === 'cast' && pathMode.scene === UI.scene && pathMode.cast === selected.id));
}

  const panelPlaced = placed.slice().sort((a,b)=>a.cast.role.localeCompare(b.cast.role)).map(p=>`<div class="sp-row">
      <span class="sp-dot" style="--c:${p.cast.color}">${initials(p.cast.name)}</span>
      <div class="sp-main"><b>${esc(p.cast.role)}</b><span>${esc(p.cast.name)}</span></div>

    </div>`).join('') || `<div class="empty" style="padding:16px 0">${T('Nobody on stage yet.')}</div>`;

  const panelWings = wings.map(c=>`<div class="sp-row">
      <span class="sp-dot" style="--c:${c.color};opacity:.5">${initials(c.name)}</span>
      <div class="sp-main"><b>${esc(c.role)}</b><span>${esc(c.name)}</span></div>

  const propRows = sceneProps.map(pr=>`<div class="sp-row">
      <span class="sp-dot" style="--c:#9a8a6e;border-radius:7px">${pr.qty}</span>

      <button class="sp-btn" data-rmprop="${pr.id}" title="${T('Take this prop out of the scene')}">×</button>

  return `<div class="wrap">

      <div class="grp"><span class="k">${T('COPY BLOCKING')}</span><select class="sel" style="width:196px" data-copyfrom="${sc.id}">

          </div>

          </div>
          <div class="dirout" id="dir-out"></div>
        </div>
        <div class="card">
          <div class="sec">${T('On stage · {n}', {n:placed.length})}</div>
          ${panelPlaced}

        <div class="card">
          <div class="sec">${T('In the wings · {n}', {n:wings.length})}</div>

            ${availProps.map(pr=>`<option value="${pr.id}">${esc(pr.name)} — ${T(pr.status)}</option>`).join('')}
          </select>`:''}
        </div>
        <div class="card">
          <div class="sec">${T('Cues · {n}', {n:sceneCues.length})}</div>
          ${sceneCues.length ? sceneCues.map(c=>`<div class="cue-mini">
            <span class="no">${cueLabel(c)}</span>
            <span class="tx">${esc(c.desc)}<br><span class="dim2" style="font-size:10.5px">${T(c.trig)} · ${esc(c.dur||'—')}</span></span>
          </div>`).join('') : `<div class="empty" style="padding:16px 0">${T('No cues logged for this scene.')}</div>`}
        </div>
      </div>
    </div>
  </div>`;
}

  const rows = S.cast.map(c=>{
    const sc = castScenes(c.id);
    return `<div class="castrow">
      <span class="st" style="flex:0 0 8px"><i style="background:${c.color}"></i></span>

/* ==================================================================
   10. VIEW — RUN SHOW
   ================================================================== */
function fmtClock(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}

function jumpRunScene(dir){
  const list = cueList();
  if(!list.length) return;
  const cur = list[Math.min(UI.runIdx || 0, list.length - 1)];
  const scenes = sceneList();
  let si = sceneIdx(cur.scene) + dir;
  while(si >= 0 && si < scenes.length && !list.some(c=>c.scene===scenes[si].id)) si += dir;
  if(si < 0 || si >= scenes.length){ toast(T(dir > 0 ? 'Last scene with cues.' : 'First scene with cues.')); return; }
  const fi = list.findIndex(c=>c.scene===scenes[si].id);
  const fromScene = cur.scene;
  UI.runIdx = Math.max(0, fi);
  UI.executed = UI.executed.slice(0, UI.runIdx);
  queueMove(fromScene, scenes[si].id);
  render();
}

function liveFloor(sceneId, small){
  const placed = onStage(sceneId);
  const marks  = pmarksIn(sceneId);
  const toks = placed.map(p=>{
    const a = appOf(sceneId, p.cast.id);
    const v = tf(p.x, p.y);
    const edge = v.x < 26 ? ' edge-l' : (v.x > 74 ? ' edge-r' : '');
    const short = p.cast.role.split('/')[0].trim();
    return `<span class="ltok${a && a.set ? ' ok' : ''}${edge}" data-id="${p.cast.id}" style="left:${v.x}%;top:${v.y}%;--c:${p.cast.color}" title="${esc(p.cast.role)}">${initials(p.cast.name)}<span class="llbl">${esc(short)}</span></span>`;
  }).join('');
  const prs = marks.map(m=>{
    const pr = propOf(m.prop); if(!pr) return '';
    const v = tf(m.x, m.y);
    const anchor = v.y > 88 ? 'translate(-50%,-100%)' : (v.y < 10 ? 'translate(-50%,0)' : 'translate(-50%,-50%)');
    const nm = pr.name.length > 14 ? pr.name.slice(0,13) + '…' : pr.name;
    return `<span class="lprop" style="left:${v.x}%;top:${v.y}%;transform:${anchor}">${esc(nm)}</span>`;
  }).join('');
  return `<div class="floorwrap${small?' small':''}${UI.face==='u'?' up':''}"${small?'':' id="live-main"'}>${toks}${prs}</div>`;
}

function blockingDelta(fromId, toId){
  const a = new Set(onStage(fromId).map(p=>p.cast.id));
  const b = new Set(onStage(toId).map(p=>p.cast.id));
  return {
    enters: [...b].filter(id=>!a.has(id)).map(id=>castOf(id).role),
    exits:  [...a].filter(id=>!b.has(id)).map(id=>castOf(id).role)
  };
}

function viewRun(){
  const list = cueList();
  if(!list.length){
    return `<div class="wrap"><div class="card" style="text-align:center;padding:56px 22px">
      <div class="h2">${T('No cues yet')}</div>
      <div class="dim" style="font-size:13px;margin:10px 0 20px">${T('The run board follows the cue list. Add SFX, LFX or prop cues first.')}</div>
      <button class="btn primary" data-view="cues">${T('Go to Sound & Light')}</button>
    </div></div>`;
  }
  const idx = UI.runIdx || 0;
  if(!UI.started){ UI.started = Date.now(); saveUI(); }

  if(idx >= list.length){
    return `<div class="wrap" style="max-width:760px">
      <div class="gostage" style="text-align:center;padding:60px 30px">
        <div class="now">${T('CURTAIN DOWN')}</div>
        <div class="cuebig" style="font-size:44px;color:var(--green)">${T('END OF SHOW')}</div>
        <div class="cuedesc" style="margin:0 auto">${T('All {n} cues called in {time}.', {n:list.length, time:'<span class="mono">'+fmtClock(Date.now()-UI.started)+'</span>'})}</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:26px">
          <button class="btn primary" data-act="startrun">${T('Run it again')}</button>
          <button class="btn ghost" data-view="cuebook">${T('Back to cue sheet')}</button>
        </div>
      </div>
    </div>`;
  }

  const cue  = list[idx];
  const next = list[idx+1];
  const sc   = sceneOf(cue.scene);
  const act  = S.acts.find(a=>a.id===sc.act);
  const placed = onStage(cue.scene);
  const wings  = offStage(cue.scene);
  const checked = placed.filter(p=>{ const a = appOf(cue.scene, p.cast.id); return a && a.set; }).length;
  const nScene = sceneList()[sceneIdx(cue.scene) + 1];
  const delta = nScene ? blockingDelta(cue.scene, nScene.id) : null;
  const done = UI.executed.slice().reverse().slice(0,5);
  const pathCount = placed.filter(p=>{
    const a = appOf(cue.scene, p.cast.id);
    return a && Array.isArray(a.path) && a.path.length;
  }).length;

  return `<div class="wrap live">
    <div class="livehead">
      <div>
        <div class="tag">${T('Scene {tag} · {act}', {tag:sceneTag(cue.scene), act:esc(act ? act.name : '')})}</div>
        <h2>${esc(sc.title)}</h2>
        <div class="sub">${T('{on} on stage · {wings} in the wings · {cues} in this scene', {on:placed.length, wings:wings.length, cues:pl(cuesIn(cue.scene).length,'cue')})}</div>
      </div>
      <div style="display:flex;gap:26px;align-items:flex-end">
        <div class="liveclock"><div class="k">${T('CUE')}</div><div class="v">${cueLabel(cue)}</div></div>
        <div class="liveclock"><div class="k">${idx+1} / ${list.length}</div><div class="v" id="run-elapsed">${fmtClock(Date.now()-UI.started)}</div></div>
        <div class="segs" style="align-self:flex-end;margin-bottom:2px">
          <button class="${UI.face==='d'?'on':''}" data-face="d" title="${T('Audience at the bottom')}">↓</button>
          <button class="${UI.face==='u'?'on':''}" data-face="u" title="${T('Audience at the top')}">↑</button>
          <button class="${UI.mirror?'on':''}" data-mirror="1" title="${T('Mirror the floor')}">⇄</button>
        </div>
      </div>
    </div>

    <div class="livegrid">
      <div class="card floorcard">
        <div class="sec" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span>${T('Now on stage · {checked}/{total} checked', {checked:checked, total:placed.length})}</span>
          <span style="display:flex;gap:6px;align-items:center;flex:0 0 auto">
            ${pathCount ? `<button class="sp-btn" data-act="replaypaths">${T('Replay movement')}</button>` : ''}
            <button class="sp-btn" data-clearset="${cue.scene}">${T('Clear checks')}</button>
          </span>
        </div>
        ${pathCount ? `<div class="nextline" style="margin-top:2px"><span class="k">${T('PATHS')}</span><span>${pathCount === 1 ? T('One actor follows a recorded path.') : T('{n} actors follow a recorded path.', {n:pathCount})}</span></div>` : ''}
        ${liveFloor(cue.scene)}
        <div class="setrow">
          ${placed.map(p=>{
            const a = appOf(cue.scene, p.cast.id);
            return `<button class="chipbtn${a && a.set ? ' ok':''}" style="--c:${p.cast.color}" data-setactor="${p.cast.id}" data-setscene="${cue.scene}"><i></i>${esc(p.cast.role)}${a && a.set ? '<span class="tick">✓</span>' : ''}</button>`;
          }).join('') || `<span class="dim2" style="font-size:11.5px">${T('nobody placed on this floor')}</span>`}
        </div>
        ${wings.length?`<div class="nextline"><span class="k">${T('WINGS')}</span><span>${wings.map(c=>esc(c.role)).join(', ')}</span></div>`:''}
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="card">
          <div class="sec">${T('Standby')}${next?' · '+cueLabel(next):''}</div>
          ${next?`<div class="badge ${TYPES[next.type].cls}" style="margin-bottom:8px">${T(TYPES[next.type].label).toUpperCase()}</div>
            <div style="font-size:15px;line-height:1.45;margin:6px 0 8px">${esc(next.desc)}</div>
            <div class="dim2" style="font-size:11px">${T(next.trig)} · ${esc(next.dur||'—')} · ${T('scene {tag}', {tag:sceneTag(next.scene)})}</div>
            <div class="dim2" style="font-size:11px;margin-top:8px">${T('{n} after this one', {n:pl(list.length-idx-1,'cue')})}</div>`
            :`<div class="dim" style="font-size:13px">${T('Last cue of the show. Stand by for the call.')}</div>`}
          ${(()=>{const then=list.slice(idx+2, idx+5); return then.length?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:11px">
            <div style="font:9px/1 var(--mono);letter-spacing:.16em;color:var(--dim2);margin-bottom:7px">${T('THEN')}</div>
            ${then.map(c=>`<div style="display:flex;gap:8px;align-items:baseline;font-size:11.5px;line-height:1.55">
              <span class="mono" style="flex:0 0 42px;color:var(--dim2);font-size:10px">${cueLabel(c)}</span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.desc)}</span></div>`).join('')}
          </div>`:'';})()}
        </div>

        <div class="card">
          <div class="sec">${T('Now cueing')}</div>
          <div class="badge ${TYPES[cue.type].cls}">${T(TYPES[cue.type].label).toUpperCase()}</div>
          <div style="font-size:15px;line-height:1.45;margin:8px 0 6px">${esc(cue.desc)}</div>
          <div class="dim2" style="font-size:11px">${T(cue.trig)} · ${esc(cue.dur||'—')}</div>
          ${cue.note?`<div class="dim" style="font-size:11.5px;margin-top:8px;line-height:1.5">${esc(cue.note)}</div>`:''}

/* ---------- run-stage motion along recorded paths ---------- */
function rafFrame(fn){
  return (typeof requestAnimationFrame === 'function') ? requestAnimationFrame(fn) : setTimeout(fn, 16);
}
function cancelFrame(id){
  if(id == null) return;
  if(typeof cancelAnimationFrame === 'function') cancelAnimationFrame(id);
  else clearTimeout(id);
}
function currentRunCue(){
  const list = cueList();
  return list[UI.runIdx] || null;
}
function clearRunAnimation(){
  if(runAnim && runAnim.raf) cancelFrame(runAnim.raf);
  runAnim = null;
  runPositions = {};
}
function resetRunMotion(){
  clearRunAnimation();
  runScene = null;
}
function liveTokenEl(id){ return document.querySelector('#live-main .ltok[data-id="' + id + '"]'); }
function setRunPosition(id, p){
  runPositions[id] = {x:p.x, y:p.y};
  const el = liveTokenEl(id);
  if(el){ const v = tf(p.x, p.y); el.style.left = v.x + '%'; el.style.top = v.y + '%'; }
}
function applyRunPositions(){
  Object.keys(runPositions).forEach(id=>{
    const el = liveTokenEl(id);
    if(el){ const p = runPositions[id], v = tf(p.x, p.y); el.style.left = v.x + '%'; el.style.top = v.y + '%'; }
  });
}
function countRunPaths(scene){
  return onStage(scene).filter(p=>{
    const a = appOf(scene, p.cast.id);
    return a && Array.isArray(a.path) && a.path.length;
  }).length;
}
function playRunPaths(scene){
  clearRunAnimation();
  runScene = scene;
  const movers = [];
  onStage(scene).forEach(p=>{
    runPositions[p.cast.id] = {x:p.x, y:p.y};
    const a = appOf(scene, p.cast.id);
    const pts = a && Array.isArray(a.path) ? a.path : [];
    if(pts.length){
      movers.push({id:p.cast.id, start:{x:p.x, y:p.y},
                   pts:pts.map(q=>({x:q.x, y:q.y})), delay:movers.length * 140});
    }
  });
  if(!movers.length){ applyRunPositions(); return 0; }
  const now = Date.now(), segMs = 850;
  const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const frame = ()=>{
    if(!runAnim || runAnim.scene !== scene) return;
    const t = Date.now();
    let allDone = true;
    movers.forEach(m=>{
      const elapsed = t - now - m.delay;
      if(elapsed <= 0){ setRunPosition(m.id, m.start); allDone = false; return; }
      const total = m.pts.length * segMs;
      if(elapsed >= total){ setRunPosition(m.id, m.pts[m.pts.length-1]); return; }
      allDone = false;
      const raw = elapsed / segMs;
      const seg = Math.min(m.pts.length-1, Math.floor(raw));
      const f = ease(raw - seg);
      const from = seg === 0 ? m.start : m.pts[seg-1];
      const to = m.pts[seg];
      setRunPosition(m.id, {x:from.x + (to.x-from.x)*f, y:from.y + (to.y-from.y)*f});
    });
    if(!allDone){ runAnim.raf = rafFrame(frame); }
    else { runAnim.done = true; runAnim.raf = null; applyRunPositions(); }
  };
  runAnim = {scene, movers, start:now, raf:null, done:false};
  const rafId = rafFrame(frame);
  if(runAnim && !runAnim.done) runAnim.raf = rafId;
  return movers.length;
}
function syncRunMotion(){
  const cue = currentRunCue();
  if(!cue){ clearRunAnimation(); runScene = null; return; }
  if(runScene !== cue.scene){ playRunPaths(cue.scene); }
  else { applyRunPositions(); }
}
function replayRunPaths(){
  const cue = currentRunCue();
  if(!cue) return;
  if(!countRunPaths(cue.scene)){ toast(T('No recorded paths in this scene.')); return; }
  resetRunMotion();
  render();
}
